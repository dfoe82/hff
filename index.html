<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organizer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1514" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.3.1">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=1.3.1">
<title>Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: ein App-Rahmen mit drei Bereichen; oben Tabs am Desktop, unten Tab-Leiste am Handy; Kontostände zuerst, Details darunter */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e4eae8; --ink:#16201e; --muted:#5a6966; --line:#d6dfdc;
  --accent:#0d6b61; --accent-ink:#ffffff;
  --bank:#2b5c9c; --cash:#9a6a0c; --save:#7a4fc0; --pos:#25764a; --neg:#b0373a; --warn:#a85d00;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px; --shadow:0 1px 2px rgb(20 40 36 / .06), 0 6px 20px rgb(20 40 36 / .06);
  --s0:#d2453f; --s1:#2b6fd6; --s2:#2c9a5b; --s3:#c98a12; --s4:#8a4fc7; --s5:#14918f; --s6:#d0567f; --s7:#6b7b2a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201e; --sunk:#131a19; --ink:#e4ebe9; --muted:#93a29e; --line:#2a3532;
  --accent:#43b6a7; --accent-ink:#06201c;
  --bank:#78a6e6; --cash:#e2ad4c; --save:#b893f0; --pos:#5fc78c; --neg:#f07b7b; --warn:#f0a24a;
  --shadow:0 1px 2px rgb(0 0 0 / .4);
  --s0:#ef6d66; --s1:#6fa0f0; --s2:#5cc785; --s3:#e6b04a; --s4:#b088ea; --s5:#4fc4c0; --s6:#ec85a8; --s7:#a8b85a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --sunk:#131a19; --ink:#e4ebe9; --muted:#93a29e; --line:#2a3532;
  --accent:#43b6a7; --accent-ink:#06201c;
  --bank:#78a6e6; --cash:#e2ad4c; --save:#b893f0; --pos:#5fc78c; --neg:#f07b7b; --warn:#f0a24a;
  --shadow:0 1px 2px rgb(0 0 0 / .4);
  --s0:#ef6d66; --s1:#6fa0f0; --s2:#5cc785; --s3:#e6b04a; --s4:#b088ea; --s5:#4fc4c0; --s6:#ec85a8; --s7:#a8b85a;
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* Kopf */
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--pos)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.tabs svg{width:18px;height:18px;flex:none}
@media (max-width:700px){
  nav.tabs button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.tabs.many button{font-size:.64rem;padding:6px 2px}
  nav.tabs.many .l-long{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 10px;border-radius:10px;flex:1}
  nav.tabs button[aria-selected="true"]{box-shadow:none;background:transparent;color:var(--accent)}
  nav.tabs svg{width:22px;height:22px}
}

/* Allgemein */
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-block:22px 12px}
.sec-head h2{font-size:1.15rem;font-weight:700;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--neg)}
.btn.danger[data-armed]{background:var(--neg);border-color:var(--neg);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Finanzen */
.accounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.accounts.one{grid-template-columns:1fr}

.acct{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;cursor:pointer}
.acct[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.acct .label{display:flex;align-items:center;gap:7px}
.acct .label i{width:10px;height:10px;border-radius:3px;display:inline-block}
.acct.bank{color:var(--bank)} .acct.cash{color:var(--cash)} .acct.total{color:var(--ink)} .acct.save{color:var(--save)}
.acct.save .label i{background:var(--save);transform:rotate(45deg) scale(.85)}
.accounts.has-save{grid-template-columns:repeat(4,minmax(0,1fr))}
.accounts.one.has-save{grid-template-columns:repeat(2,minmax(0,1fr))}
.accounts.one.has-save .acct.total-sub{color:var(--ink);cursor:default}
.accounts.one.has-save .acct.total-sub .label i{background:var(--ink)}
.accounts.one.has-save .acct.wide{grid-column:1/-1;cursor:default}
.save-hero{cursor:default}
.save-hero .bal{font-size:1.9rem}
.accounts.one.has-save .acct .bal{font-size:1.45rem}
.acct.bank .label i{background:var(--bank)} .acct.cash .label i{background:var(--cash);border-radius:50%} .acct.total .label i{background:var(--ink)}
.acct .bal{font-family:var(--f-num);font-weight:600;font-size:1.45rem;color:var(--ink);overflow-wrap:anywhere}
.acct .sub{font-size:.8rem;color:var(--muted)}
.bal.neg{color:var(--neg)!important}
@media (max-width:860px){.accounts.has-save{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.accounts.has-save .acct.save,.accounts.has-save .acct.total{grid-column:auto;flex-direction:column;align-items:flex-start;justify-content:flex-start}.accounts.one.has-save .acct .bal{font-size:1.2rem}}
@media (max-width:560px){.accounts{grid-template-columns:1fr 1fr}.acct.total{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}.acct .bal{font-size:1.2rem}}

.accounts.one .acct.total{cursor:default;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px}
.accounts.one .acct .bal{font-size:1.9rem}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .m{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:9.5em;text-align:center}
.fin-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.fin-grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stats > div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .v{font-family:var(--f-num);font-weight:600;font-size:1.05rem}
.cats{padding:14px;display:flex;flex-direction:column;gap:10px}
.rec-list{display:flex;flex-direction:column}
.rec-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;align-items:baseline;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.rec-row:first-child{border-top:0}
.rec-row b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-row small{grid-column:1/-1;color:var(--muted);font-size:.78rem}
.rec-row.paused{opacity:.55}
.rec-tag{color:var(--accent);font-weight:700}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.88rem}
.cat-row .bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.cat-row .bar i{display:block;height:100%;background:var(--neg);opacity:.75;border-radius:3px}
.side{display:flex;flex-direction:column;gap:12px}

.ledger{overflow:hidden}
.day{padding:8px 14px;background:var(--sunk);font-size:.78rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.tx{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.day + .tx{border-top:0}
.tx:hover{background:var(--sunk)}
.tx .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:1rem;background:var(--sunk);color:var(--muted);grid-row:span 2}
.tx .ico.einnahme{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.tx .ico.ausgabe{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}
.tx .ico.sparen{color:var(--save);background:color-mix(in srgb,var(--save) 15%,transparent)}
.tag.save{color:var(--save)} .tag.save i{transform:rotate(45deg) scale(.85)}
.save-v{color:var(--save)}
.save-btn{color:var(--save);border-color:color-mix(in srgb,var(--save) 45%,var(--line))}
.tx .ico.transfer,.tx .ico.loan{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:2}
.tx .amt{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.tx .run{font-family:var(--f-num);font-size:.75rem;color:var(--muted);text-align:right;grid-column:3;white-space:nowrap}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)} .amt.neu{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.tag.bank{color:var(--bank)} .tag.cash{color:var(--cash)}
.tag i{width:7px;height:7px;display:inline-block;border-radius:2px;background:currentColor}
.tag.cash i{border-radius:50%}

/* Dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(10 20 18 / .45)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:20px;overflow:auto;max-height:calc(100dvh - 24px)}
.dlg h3{font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2 > *{min-width:0}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible + span{outline:2px solid var(--accent)}
.hint{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.dlg-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-actions .spacer{margin-right:auto}
.err{color:var(--neg);font-size:.85rem;min-height:1em}
.amount-in{font-family:var(--f-num)!important;font-size:1.3rem!important;font-weight:600}

/* Stundenplan */
.tt-scroll{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px;table-layout:fixed}
table.tt th{font-size:.8rem;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center}
table.tt th.today{color:var(--accent)}
table.tt th.today span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px}
table.tt td.per{width:78px;text-align:left;vertical-align:middle;padding:4px}
.per b{display:block;font-family:var(--f-display);font-size:1rem}
.per small{font-family:var(--f-num);font-size:.7rem;color:var(--muted);line-height:1.25;display:block}
td.per.now b{color:var(--accent)}
.cell{width:100%;min-height:58px;height:100%;border-radius:10px;border:1px dashed var(--line);background:transparent;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;color:var(--muted);overflow:hidden}
.cell.filled{border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink)}
.cell b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.now{box-shadow:0 0 0 2px var(--accent)}
.cell .plus{font-size:1.1rem;opacity:.4;text-align:center}
.break td{padding:0}
.break div{font-size:.7rem;color:var(--muted);text-align:center;border-top:1px dotted var(--line);line-height:1;padding-top:3px}
.tt-desk{display:block} .tt-mob{display:none}
@media (max-width:640px){.tt-desk{display:none}.tt-mob{display:block}}
.daytabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:10px}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:600;color:var(--muted)}
.daytabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daytabs button.today{color:var(--accent)}
.daytabs button.today[aria-pressed="true"]{color:var(--bg)}
.daylist{display:flex;flex-direction:column;gap:6px}
.dl-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:stretch}

/* Aufgaben */
.quick{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px auto;gap:8px;padding:10px}
.quick input,.quick select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-width:0;font-size:16px;width:100%}
@media (max-width:640px){.quick{grid-template-columns:1fr 1fr}.quick input[name=title]{grid-column:1/-1}.quick .btn{grid-column:1/-1;justify-content:center}}
.group-h{display:flex;align-items:baseline;gap:8px;padding:14px 14px 6px;font-family:var(--f-display);font-weight:700}
.group-h small{font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:.8rem}
.group-h.over{color:var(--neg)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;grid-row:span 2}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--pos);border-color:var(--pos)}
.task.done .check svg{opacity:1;color:var(--surface)}
.task .tt{border:0;background:transparent;padding:0;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .tt{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .meta{grid-column:2;font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.task .meta .over{color:var(--neg);font-weight:600}
.task .meta .tod{color:var(--accent);font-weight:600}
.prio{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;grid-row:span 2}
.prio.hoch{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.prio.niedrig{background:var(--sunk);color:var(--muted)}
.prio.normal{visibility:hidden}

#backupBtn{order:3}
.brand{min-width:0}
@media (max-width:480px){.brand .sync > span{display:none}.brand h1{font-size:1.25rem}}
.brand h1{overflow:hidden;text-overflow:ellipsis}
#settingsBtn{color:var(--muted)}
#settingsBtn{order:4}
#backupBtn.due{border-color:var(--warn);color:var(--warn)}
#backupBtn.due::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media (max-width:700px){header.top{flex-wrap:nowrap}}
/* Hausaufgaben */
.hw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);position:relative}
.hw::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.hw .check{grid-row:span 2}
.hw.done .check{background:var(--pos);border-color:var(--pos)}
.hw.done .check svg{opacity:1;color:var(--surface)}
.hw .body{border:0;background:transparent;padding:0;text-align:left;display:flex;gap:8px;align-items:baseline;min-width:0}
.hw .subj{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);white-space:nowrap;flex:none}
.hw .txt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hw.done .txt{text-decoration:line-through;color:var(--muted);font-weight:500}

.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch input:checked + i{background:var(--pos)}

@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

    if (o.type!==n.type || o.amount!==n.amount || o.date!==n.date || o.text!==n.text || o.account!==n.account)

/* Verschlüsselung: AES-GCM. Der Datenschlüssel liegt nur auf diesem Gerät;

  if (!cryptoOk() || !pinSet()) return;

  if (!k){ k = b64(crypto.getRandomValues(new Uint8Array(32))); lsSet('bkKey', k); }
  const raw = unb64(k), salt = b64(crypto.getRandomValues(new Uint8Array(16)));

}
const bkName = () => (appName().toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'organizer')+'-sicherung.json';
const bkWithBelege = () => lsGet('bkBelege') !== false && belegIds().length > 0;
async function backupDataFull(){
  const d = backupData();
  if (bkWithBelege()){ try { const all = await belegAll(), ids = new Set(belegIds()); d.belege = {}; Object.keys(all).forEach(k => { if (ids.has(k)) d.belege[k] = all[k]; }); } catch(e){} }

}
async function buildBackupFile(){
  if (!pinSet()) return new File([JSON.stringify(await backupDataFull())], bkName(), {type:'application/json'});

  const wk = S.settings.pin.wk, k = lsGet('bkKey');
  if (!wk || !k) throw new Error('nokey');
  const data = await aesEnc(await aesKey(unb64(k)), new TextEncoder().encode(JSON.stringify(await backupDataFull())));
  const out = {app:'haushaltsplaner', enc:1, format:2, appVersion:APP_VERSION, exported:new Date().toISOString(), hinweis:'Verschlüsselte Sicherung – nur mit Eltern-PIN oder Notfall-Code lesbar.', salt:wk.salt, wp:wk.wp, wr:wk.wr, data};

}
const bkStamp = () => String(lsGet('changed')||0) + ':' + (lsGet('belegChanged')||0) + ':' + (bkWithBelege() ? 1 : 0) + ':' + (pinSet() ? (S.settings.pin.wk ? S.settings.pin.wk.salt : 'x') : '0') + ':' + appName();
async function prepareBackup(){
  const st = bkStamp();

  const file = await buildBackupFile(); readyBk = {stamp: st, file}; return file;
}
async function exportBackup(mode){
  if (mode !== 'send') mode = '';

  if (!file){
    try { file = await prepareBackup(); }
    catch(e){
      if (e && e.message === 'nokey') return requirePin('Die erste verschlüsselte Sicherung', pin => {
        ensureWraps(pin).then(() => prepareBackup()).then(() => toast('Verschlüsselung eingerichtet – bitte noch einmal auf „Jetzt sichern“ tippen.')).catch(() => toast('Verschlüsselung konnte nicht eingerichtet werden.'));

      return;
    }

  }

    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title: mode==='send' ? 'Finanzen von ' + appName() : file.name});
    } else {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    lsSet('lastBackup', Date.now()); lsSet('bkSnooze', 0); updateBackupHint(); toast(mode==='send' ? 'Fertig – deine Eltern können die Datei jetzt in ihrer App einlesen.' : pinSet() ? 'Verschlüsselte Sicherung erstellt' : 'Sicherung erstellt');
  } catch(e){ if (e && e.name === 'AbortError') return; toast('Sicherung konnte nicht erstellt werden.'); }

  const r = new FileReader();

    let d; try { d = JSON.parse(r.result); } catch(e){ toast('Die Datei ist keine gültige Sicherung.'); return; }
    if (!d || d.app !== 'haushaltsplaner'){ toast('Diese Datei ist keine Sicherung dieser App.'); return; }
    if (!d.enc) return applyBackup(d, d);
    if (!cryptoOk()){ toast('Dieser Browser kann die verschlüsselte Sicherung nicht öffnen. Bitte die App über https öffnen.'); return; }
    const local = lsGet('bkKey');
    if (local){ try { const inner = JSON.parse(new TextDecoder().decode(await aesDec(await aesKey(unb64(local)), d.data))); return applyBackup(inner, d); } catch(e){} }

      const wait = pinWait(); if (wait){ err.textContent = wait; return false; }
      const raw = f.secret.value.trim(); if (!raw) return false;
      const isCode = !/^\d{4,6}$/.test(raw);

      btn.disabled = true; err.textContent = 'Wird geöffnet …';
      (async () => {
        let k;
        try { if (!wrap) throw new Error('nowrap'); k = await aesDec(await kdf(secret, d.salt), wrap); }
        catch(e){ btn.disabled = false; f.secret.value = ''; err.textContent = pinBad(isCode ? 'Der Notfall-Code stimmt nicht.' : 'Die PIN stimmt nicht.'); return; }
        let inner;
        try { inner = JSON.parse(new TextDecoder().decode(await aesDec(await aesKey(k), d.data))); }
        catch(e){ btn.disabled = false; pinGood(true); addLog('Wiederherstellen abgelehnt: Sicherungsdatei wurde verändert oder ist beschädigt'); err.textContent = 'Die PIN ist richtig, aber die Sicherungsdatei wurde verändert oder ist beschädigt. Sie kann nicht wiederhergestellt werden.'; return; }
        lsSet('bkKey', b64(k)); pinGood(true);
        dlg.close(); applyBackup(inner, d);
      })();
      return false;
    });
}

/* ---------- Eltern-PIN ---------- */
// Kindersicherung: verhindert neugieriges Verstellen. Fehlversuche führen zu wachsenden Wartezeiten.
function hashStr(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8,'0') + (h1 >>> 0).toString(16).padStart(8,'0');
}
const pinHash = (pin, salt) => { let h = pin; for (let i = 0; i < 500; i++) h = hashStr(salt + ':' + h, i); return h; };
const pinSet = () => !!(S.settings && S.settings.pin);
let unlockedUntil = 0;
const isUnlocked = () => !pinSet() || Date.now() < unlockedUntil;
// Wartezeit nach dem 5., 6., 7., 8. und jedem weiteren Fehlversuch
const LOCK_STEPS = [30e3, 60e3, 5*60e3, 15*60e3, 60*60e3];
function fmtWait(ms){ const s = Math.ceil(ms/1000); if (s < 60) return s + ' Sekunden'; const m = Math.ceil(s/60); if (m < 60) return m + (m===1 ? ' Minute' : ' Minuten'); const h = Math.ceil(m/60); return h + (h===1 ? ' Stunde' : ' Stunden'); }
function pinWait(){ const until = +(lsGet('pinBlock')||0); return Date.now() < until ? `Zu viele falsche Versuche. Bitte warte noch ${fmtWait(until - Date.now())}.` : ''; }
function pinBad(msg){
  const fails = (+(lsGet('pinFails')||0)) + 1; lsSet('pinFails', fails);
  lsSet('pinFailsSince', (+(lsGet('pinFailsSince')||0)) + 1);
  addLog('Falsche PIN oder falscher Notfall-Code eingegeben');
  if (fails < 5) return `${msg} Noch ${5 - fails} ${5 - fails === 1 ? 'Versuch' : 'Versuche'}, dann wird die Eingabe gesperrt.`;
  const step = LOCK_STEPS[Math.min(fails - 5, LOCK_STEPS.length - 1)];
  lsSet('pinBlock', Date.now() + step);
  addLog('PIN-Eingabe für ' + fmtWait(step) + ' gesperrt');
  return `${msg} Die Eingabe ist jetzt für ${fmtWait(step)} gesperrt.`;
}
function pinGood(silent){
  const since = +(lsGet('pinFailsSince')||0);
  lsSet('pinFails', 0); lsSet('pinBlock', 0); lsSet('pinFailsSince', 0);
  unlockedUntil = Date.now() + 5*60000;
  if (since && !silent) setTimeout(() => toast(`Hinweis: ${since} falsche PIN-${since===1 ? 'Eingabe' : 'Eingaben'} seit dem letzten Entsperren. Details im Protokoll.`), 500);
}
function requirePin(what, fn, force){
  if (!force && isUnlocked()) return fn();
  const form = openDlg(`
    <h3>Eltern-PIN</h3>
    <p class="hint" style="margin:0">${esc(what)} ist durch die Eltern-PIN geschützt.</p>
    <label class="field"><span>PIN eingeben</span><input class="pin-in" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus id="pin-check"></label>
    <div class="err" id="f-err">${esc(pinWait())}</div>
    <details class="pin-forgot"><summary>PIN vergessen?</summary>
      <p>Gib den Notfall-Code ein, den du beim Festlegen der PIN aufgeschrieben hast. Die PIN wird dann entfernt.</p>
      <div style="display:flex;gap:8px"><input class="pin-code" id="pin-recovery" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX"><button type="button" class="btn sm" id="pin-recover">Entsperren</button></div>
    </details>
    <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary" type="submit">Weiter</button></div>`, f => {
      const err = f.querySelector('#f-err');
      const wait = pinWait(); if (wait){ err.textContent = wait; return false; }
      const P = S.settings.pin, val = f.pin.value.trim();
      if (pinHash(val, P.s) !== P.h){ f.pin.value = ''; f.pin.focus(); err.textContent = pinBad('Die PIN stimmt nicht.'); return false; }
      pinGood();
      setTimeout(() => fn(val), 0);
    });
  form.querySelector('#pin-recover').addEventListener('click', () => {
    const err = form.querySelector('#f-err');
    const wait = pinWait(); if (wait){ err.textContent = wait; return; }
    const code = form.querySelector('#pin-recovery').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    const P = S.settings.pin;
    if (P.r && code && pinHash(code, P.s) === P.r){
      pinGood(true); addLog('Eltern-PIN mit dem Notfall-Code entfernt');
      S.settings.pin = null; save('settings'); dlg.close(); render(); toast('PIN entfernt. Du kannst in den Einstellungen eine neue festlegen.');
    } else err.textContent = pinBad('Der Notfall-Code stimmt nicht.');
  });
}

      const salt = newId() + newId();

      const rnd = new Uint32Array(8); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(rnd) : rnd.forEach((_,i) => rnd[i] = Math.random()*1e9);

      S.settings.pin = {s: salt, h: pinHash(a, salt), r: pinHash(code, salt), wk: null};
      pinGood(true); save('settings');

let updCheckAt = 0;
function checkForUpdate(){
  if (!/^https?:$/.test(location.protocol) || Date.now() - updCheckAt < 10*60000) return;
  updCheckAt = Date.now();
  fetch(location.href.split('#')[0], {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => {
    const m = t.match(/const APP_VERSION = '([\d.]+)'/);
    if (m && verCmp(m[1], APP_VERSION) > 0 && lsGet('updSkip') !== m[1]){
      $('#updText').textContent = `Version ${m[1]} ist da (du nutzt ${APP_VERSION}). Deine Daten bleiben erhalten, vorher wird automatisch ein Sicherungspunkt angelegt.`;
      $('#updBanner').hidden = false; $('#updBanner').dataset.v = m[1];
    }
  }).catch(() => {});
}
function doUpdate(){
  const reg = navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);

}

function applySections(){
  const vis = SECTIONS.map(x => x[0]).filter(isVisible);
  if (!vis.includes(ui.tab)) ui.tab = vis[0] || 'finanzen';
  document.querySelectorAll('nav.tabs button').forEach(b => { b.hidden = !isVisible(b.dataset.tab); });
  const nav = document.querySelector('nav.tabs'); nav.hidden = vis.length < 2; nav.classList.toggle('many', vis.length >= 5);
  document.body.classList.toggle('single', vis.length < 2);
}

  const n = appName();

  if (document.title !== n) document.title = n;

const setIcon = (name, color) => `<span class="set-ic" style="--ic:${color}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SET_ICONS[name] || ''}</svg></span>`;
function setRow(o){
  return `<button type="button" class="set-it" ${o.page ? `data-page="${o.page}"` : ''} ${o.act ? `data-do="${o.act}"` : ''}>
    ${setIcon(o.ic, o.c)}

}
function setToggle(o){

function changeSetting(fn, page){ fn(); save('settings'); applyName(); render(); settingsDialog(page); }

function settingsDialog(page){

  if (page === 'name' || page === 'mode') page = 'profile';
  if (page === 'money') { if (!isKid()) page = 'main'; }
  if (page === 'kids' && isKid()) page = 'main';
  const kid = isKid();
  const vis = SECTIONS.filter(([k]) => isVisible(k));
  const last = +(lsGet('lastBackup')||0);
  const fixedCount = S.finance.recurring.filter(r => r.type !== 'sparen').length;
  const badge = pinSet() && isUnlocked() ? '<span class="set-badge">PIN entsperrt</span>' : '';
  let body = '';

  if (page === 'main'){
    const name = appName();
    body += `<div class="set-grp"><button type="button" class="set-profile" data-page="profile">
      <span class="set-avatar" aria-hidden="true">${esc((name.trim()[0] || 'O').toUpperCase())}</span>
      <span class="set-tx"><b>${esc(name)}</b><small>${kid ? 'Kinder-Modus' : 'Erwachsenen-Modus'}</small></span>
      ${badge}<span class="set-chev" aria-hidden="true">›</span></button></div>`;
    const nNew = logNew(), newTag = nNew ? `<span class="set-new">${nNew} neu</span>` : '';
    const fixedList = S.finance.recurring.filter(r => r.type !== 'sparen');
    const fixedSub = fixedList.length ? esc(fixedList.slice(0, 2).map(r => r.text + ' ' + euro(r.amount)).join(', ') + (fixedList.length > 2 ? ' …' : '')) : 'Noch keine';
    body += setGroup('', setRow({page:'sections', ic:'grid', c:'var(--s1)', t:'Bereiche', s:'Was unten in der Leiste steht', v: vis.length + ' von ' + SECTIONS.length}));
    if (kid){
      body += setGroup('Daten',
        setRow({act:'backup', ic:'download', c:'var(--warn)', t:'Sichern & Wiederherstellen', s:'Letzte Sicherung: ' + ago(last)}) +
        setRow({act:'send', ic:'send', c:'var(--s5)', t:'An Eltern senden', s:'Per AirDrop oder Nachricht'}) +
        setRow({page:'belege', ic:'receipt', c:'var(--warn)', t:'Belege', s: belegCountTxt()}));
      body += `<div class="set-grp"><div class="set-gl set-gl-row">🔒 Für Eltern <span class="set-pinb ${pinSet() ? 'on' : 'off'}">${pinSet() ? 'PIN aktiv' : 'PIN aus'}</span></div><div class="set-card">
        ${setRow({act:'parent', ic:'eye', c:'var(--pos)', t:'Eltern-Ansicht', s:'Finanzen ausführlich ansehen'})}
        ${setRow({page:'fixed', ic:'repeat', c:'var(--s3)', t:'Taschengeld & feste Beträge', s: fixedSub})}
        ${setRow({page:'money', ic:'wallet', c:'var(--bank)', t:'Geld & Sparen', s: ({cash:'Bargeld', bank:'Bankkonto', both:'Bargeld & Konto'})[kidAcc()] + ' · ' + SV().name})}
        ${setRow({page:'pin', ic:'lock', c:'var(--neg)', t:'Eltern-PIN', s: pinSet() ? 'PIN ändern, Notfall-Code' : 'Noch keine PIN festgelegt'})}
        ${setRow({act:'log', ic:'list', c:'var(--muted)', t:'Protokoll', s:'Wer hat was geändert', v: newTag})}
      </div><p class="set-note">${pinSet() ? 'Die Einstellungen sind mit der Eltern-PIN geschützt.' : 'Tipp: Mit einer Eltern-PIN kann das Kind hier nichts ändern.'}</p></div>`;
    } else {
      body += setGroup('Finanzen',
        setToggle({id:'set-combined', ic:'swap', c:'var(--bank)', t:'Bank & Bargeld zusammenlegen', s:'Nur ein Kontostand', on: !!S.settings.combined}) +
        setRow({act:'start', ic:'euro', c:'var(--accent)', t: isCombined() ? 'Anfangsbestand' : 'Anfangsbestände', s:'Stand, mit dem du angefangen hast', v: euro(S.finance.start.bank + S.finance.start.cash)}) +
        setRow({page:'fixed', ic:'repeat', c:'var(--s3)', t:'Regelmäßige Buchungen', s: fixedSub, v: fixedList.length ? String(fixedList.length) : ''}) +
        setRow({page:'kids', ic:'users', c:'var(--s6)', t:'Finanzen der Kinder', s: S.kids.items.length ? S.kids.items.length + (S.kids.items.length === 1 ? ' Kind · ' : ' Kinder · ') + esc(S.kids.items.map(k => k.name).join(', ')) : 'Sicherung eines Kindes einlesen'}));
      body += setGroup('Daten', setRow({act:'backup', ic:'download', c:'var(--warn)', t:'Sichern & Wiederherstellen', s:'Letzte Sicherung: ' + ago(last)}) +
        setRow({page:'belege', ic:'receipt', c:'var(--s5)', t:'Belege & Garantie', s: belegCountTxt()}));
      body += setGroup('Sicherheit',
        setRow({page:'pin', ic:'lock', c:'var(--neg)', t:'Eltern-PIN', s: pinSet() ? 'Aktiv' : 'Aus'}) +
        setRow({act:'log', ic:'list', c:'var(--muted)', t:'Protokoll', s:'Wer hat was geändert', v: newTag}));
    }
    body += `<button type="button" class="set-ver" data-page="version">${esc(appName())} · Version ${APP_VERSION} · Was ist neu?</button>`;
  }

  if (page === 'profile'){
    body += `<div class="set-grp"><div class="set-gl">Name der App</div><div class="set-card set-pad">
      <input class="set-input" name="appName" value="${esc(S.settings.appName || '')}" maxlength="40" placeholder="${esc(DEFAULT_NAME)}" id="set-name" aria-label="Name der App">
      <button type="submit" class="btn primary" style="justify-content:center">Name übernehmen</button>
    </div><p class="set-note">Erscheint als Überschrift und im Browser-Tab. Leer lassen für „${esc(DEFAULT_NAME)}“.</p></div>
    <div class="set-grp"><div class="set-gl">Für wen ist die App?</div><div class="set-card set-pad">
      <div class="seg"><label><input type="radio" name="mode" value="adult" ${kid ? '' : 'checked'}><span>Erwachsene</span></label><label><input type="radio" name="mode" value="kid" ${kid ? 'checked' : ''}><span>Kinder (ab 10)</span></label></div>
    </div><p class="set-note">Im Kindermodus sind Finanzen und Sparen einfacher: ein Betrag „Mein Geld“, große Knöpfe und einfache Wörter. In den Einstellungen gibt es dann Eltern-Ansicht, Taschengeld und das Senden an die Eltern. Alle Daten bleiben beim Umschalten erhalten.</p></div>`;
  }

  if (page === 'sections'){
    body += `<div class="set-grp"><div class="set-card">
      ${SECTIONS.map(([k,l]) => `<label class="set-it set-tog set-noic"><span class="set-tx"><b>${l}</b></span><span class="switch"><input type="checkbox" name="sec" value="${k}" id="set-sec-${k}" ${isVisible(k) ? 'checked' : ''}><i></i></span></label>`).join('')}
    </div><p class="set-note">Ausgeblendete Bereiche behalten ihre Daten. Mindestens ein Bereich bleibt sichtbar.</p></div>`;
  }

  if (page === 'money'){
    body += `<div class="set-grp"><div class="set-gl">Konten</div><div class="set-card set-pad">
      <span class="set-sub">Wo hat das Kind sein Geld?</span>
      <div class="seg"><label><input type="radio" name="kidAccounts" value="cash" ${kidAcc()==='cash'?'checked':''}><span>Bargeld</span></label><label><input type="radio" name="kidAccounts" value="bank" ${kidAcc()==='bank'?'checked':''}><span>Bankkonto</span></label><label><input type="radio" name="kidAccounts" value="both" ${kidAcc()==='both'?'checked':''}><span>Beides</span></label></div>
      <span class="set-sub">Gespartes heißt</span>
      <div class="seg"><label><input type="radio" name="kidSave" value="schwein" ${S.settings.kidSave!=='konto'?'checked':''}><span>Sparschwein</span></label><label><input type="radio" name="kidSave" value="konto" ${S.settings.kidSave==='konto'?'checked':''}><span>Sparkonto</span></label></div>
    </div><p class="set-note">Bei „Beides“ gibt es Bargeld, Konto und den Geldautomaten.</p></div>
    <div class="set-grp"><div class="set-gl">Regeln</div><div class="set-card">
      ${setToggle({id:'set-confirm', t:'Von Eltern bestätigen lassen', s:'„Geld bekommen“ zählt erst nach Freigabe (nur mit Eltern-PIN)', on: S.settings.confirmIncome !== false})}
    </div></div>
    <div class="set-grp"><div class="set-gl">Kontostand</div><div class="set-card">
      ${setRow({act:'start', ic:'euro', c:'var(--accent)', t:'Startbetrag', v: euro(S.finance.start.bank + S.finance.start.cash)})}
      ${setRow({act:'kid-reset', ic:'reset', c:'var(--neg)', t:'Bei null neu beginnen', s:'Nur für Eltern · alles wird auf 0 € gesetzt'})}
    </div><p class="set-note">„Bei null neu beginnen“ löscht alle Einträge${savingsOn() ? ' und das ' + esc(SV().name) : ''} und legt vorher einen Sicherungspunkt an.</p></div>`;
  }

  if (page === 'belege') body += belegePage();
  if (page === 'fixed'){
    body += `<div class="set-grp set-rec">${renderRecurringPanel()}<p class="set-note">${kid ? 'Zum Beispiel das Taschengeld jeden Monat am 1. Es wird dann automatisch eingetragen. Das Kind kann diese Beträge nicht selbst ändern, wenn eine Eltern-PIN gesetzt ist.' : 'Zum Beispiel Miete, Kindergeld oder Taschengeld. Wird am Stichtag automatisch gebucht.'}</p></div>`;
  }

  if (page === 'kids'){
    const kids = S.kids.items;
    body += `<div class="set-grp"><div class="set-card">
      ${kids.length ? kids.map(k => `<div class="set-it set-kid">
        <span class="set-tx"><b>${esc(k.name)}</b><small>Stand: ${esc(new Date(k.exported).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}))}</small></span>
        <span class="set-kid-acts">
          <button type="button" class="btn sm" data-do="kid-view" data-id="${esc(k.id)}">Ansehen</button>
          <label class="btn sm">Neuer Stand<input type="file" accept=".json,application/json" class="file-hidden" data-kid-update="${esc(k.id)}"></label>
          <button type="button" class="btn sm danger" data-do="kid-remove" data-id="${esc(k.id)}">Entfernen</button>
        </span></div>`).join('') : '<div class="set-pad" style="color:var(--muted)">Noch keine Kinder eingelesen.</div>'}
    </div></div>
    <div class="set-grp"><button type="button" class="btn primary set-full" data-do="kid-add">+ Kind hinzufügen</button>
    <p class="set-note">Das Kind tippt auf seinem Gerät in den Einstellungen auf „An Eltern senden“ und schickt dir die Datei. Die Übersicht findest du dann im Bereich Finanzen. Deine eigenen Daten bleiben unverändert.</p></div>`;
  }

  if (page === 'pin'){
    body += `<div class="set-grp"><div class="set-card set-pad">
      <b>${pinSet() ? 'Die Eltern-PIN ist aktiv.' : 'Es ist keine Eltern-PIN gesetzt.'}</b>

    </div></div>

      ? '<button type="button" class="btn" data-do="pin-setup">PIN ändern</button><button type="button" class="btn danger" data-do="pin-remove">PIN entfernen</button>'
      : '<button type="button" class="btn primary" data-do="pin-setup">PIN festlegen</button>'}</div>`;
  }

  if (page === 'version'){
    body += `<div class="set-grp"><div class="set-card set-pad">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>Version ${APP_VERSION}</b><span style="color:var(--muted);font-size:.85rem">${esc(CHANGELOG[0][1])}</span></div>
      <div class="set-changelog">${CHANGELOG.map(([v,d,items]) => `<div><b class="num">${v}</b> <span style="color:var(--muted)">${esc(d)}</span><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>
    </div></div>`;
  }

  const form = openDlg(`
    <div class="set-head">
      ${page !== 'main' ? '<button type="button" class="set-back" data-page="main">‹ Einstellungen</button>' : ''}
      <div class="set-title"><h3>${page === 'fixed' && !kid ? 'Regelmäßige Buchungen' : SET_TITLES[page]}</h3></div>
    </div>
    ${body}
    <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Fertig</button></div>`, f => {
      if (page === 'profile'){
        const n = f.appName.value.trim().replace(/\s+/g,' ');
        changeSetting(() => { S.settings.appName = (n && n !== DEFAULT_NAME) ? n : ''; }, 'main');
        toast('Name gespeichert');
      }
      return false;
    });
  form.classList.add('set-dlg'); dlg.classList.add('is-set');
  if (page === 'belege') belegePageWire(form);

  // Navigation und Aktionen
  form.addEventListener('click', e => {
    const nav = e.target.closest('[data-page]');
    if (nav){ e.preventDefault(); settingsDialog(nav.dataset.page); return; }
    const b = e.target.closest('[data-do]'); if (!b) return;
    const a = b.dataset.do;
    if (a === 'fold'){ lsSet('setAdminOpen', !lsGet('setAdminOpen')); settingsDialog('main'); return; }
    if (a === 'parent'){ ui.parentView = true; ui.tab = 'finanzen'; lsSet('tab','finanzen'); closeDlg(); window.scrollTo(0,0); if (!pinSet()) toast('Tipp: Mit einer Eltern-PIN ist diese Ansicht geschützt.'); }
    else if (a === 'send') exportBackup('send');
    else if (a === 'log') logDialog();
    else if (a === 'backup') backupDialog();
    else if (a === 'start') startDialog();
    else if (a === 'kid-reset') kidResetStart();
    else if (a === 'bel-open'){ const t = S.finance.tx.find(x => x.id === b.dataset.id); if (t) belegViewer(t.beleg, t); }
    else if (a === 'kid-add') kidAddDialog();
    else if (a === 'kid-view'){ ui.finView = b.dataset.id; lsSet('finView', ui.finView); ui.tab = 'finanzen'; lsSet('tab','finanzen'); closeDlg(); window.scrollTo(0,0); }
    else if (a === 'kid-remove'){ if (!armed(b, 'Wirklich?')) return; const k = S.kids.items.find(x => x.id === b.dataset.id); S.kids.items = S.kids.items.filter(x => x.id !== b.dataset.id); save('kids'); if (k) addLog('Finanzen von ' + k.name + ' entfernt'); if (ui.finView === b.dataset.id){ ui.finView = 'me'; lsSet('finView','me'); } render(); settingsDialog('kids'); toast('Entfernt'); }
    else if (a === 'pin-setup') pinSetupDialog();
    else if (a === 'pin-remove'){ if (!armed(b, 'Wirklich entfernen?')) return; S.settings.pin = null; save('settings'); render(); settingsDialog('pin'); toast('Eltern-PIN entfernt'); }
  });
  // Feste Beträge (Panel enthält data-act-Knöpfe)
  const rec = form.querySelector('.set-rec');
  if (rec) rec.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'rec-new') recDialog();
    else if (b.dataset.act === 'rec-edit'){ const r = S.finance.recurring.find(x => x.id === b.dataset.id); if (r) recDialog(r); }
  });
  // Sofort wirksame Einstellungen
  form.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.kidUpdate && t.files && t.files[0]){ readKidBackup(t.files[0], t.dataset.kidUpdate); return; }
    if (t.id === 'set-combined') changeSetting(() => { S.settings.combined = t.checked; }, 'main');
    else if (t.name === 'mode') changeSetting(() => { S.settings.kid = t.value === 'kid'; ui.parentView = false; }, 'profile');
    else if (t.name === 'sec'){
      const shown = [...form.querySelectorAll('input[name=sec]:checked')].map(i => i.value);
      if (!shown.length){ t.checked = true; toast('Mindestens ein Bereich bleibt sichtbar.'); return; }
      changeSetting(() => { S.settings.hidden = SECTIONS.map(x => x[0]).filter(k => k !== 'sparen' && !shown.includes(k)); S.settings.savings = shown.includes('sparen'); }, 'sections');
    }
    else if (t.name === 'kidAccounts') changeSetting(() => { S.settings.kidAccounts = t.value; }, 'money');
    else if (t.name === 'kidSave') changeSetting(() => { S.settings.kidSave = t.value; }, 'money');
    else if (t.id === 'set-confirm') changeSetting(() => { S.settings.confirmIncome = t.checked; }, 'money');
  });
}


function render(){
  const made = runRecurring();
  if (made){ save('finance'); toast(made===1 ? '1 regelmäßige Buchung eingetragen' : made+' regelmäßige Buchungen eingetragen'); }
  applyName();
  applySections();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===ui.tab)));

  else m.innerHTML = renderTasks();
}

const TYPES = {
  einnahme:  {label:'Einnahme',  sym:'+', cls:'einnahme'},
  ausgabe:   {label:'Ausgabe',   sym:'−', cls:'ausgabe'},
  einzahlung:{label:'Einzahlung',sym:'⇢', cls:'transfer', note:'Bargeld → Bank'},
  auszahlung:{label:'Auszahlung',sym:'⇠', cls:'transfer', note:'Bank → Bargeld'},
  sparen:    {label:'Sparen',    sym:'↓', cls:'sparen'},
  entsparen: {label:'Vom Sparen',sym:'↑', cls:'sparen'},
  verliehen: {label:'Verliehen', sym:'↗', cls:'loan'},
  geliehen:  {label:'Geliehen',  sym:'↙', cls:'loan'},
  zurueckbekommen:{label:'Zurückbekommen', sym:'↙', cls:'loan'},
  zurueckgezahlt: {label:'Zurückgezahlt',  sym:'↗', cls:'loan'}
};
const ACCT = {bank:'Bankkonto', cash:'Bargeld', save:'Sparen'};
const DEFAULT_CATS = ['Lebensmittel','Haushalt','Wohnen','Auto & Tanken','Kinder','Freizeit','Gesundheit','Versicherungen','Kleidung','Geschenke','Gehalt','Kindergeld','Sonstiges'];

function effect(t){
  if (t.pending) return {bank:0,cash:0,save:0};
  const a = t.amount||0, c = t.account==='cash';
  switch(t.type){
    case 'einnahme': return c ? {bank:0,cash:a,save:0} : {bank:a,cash:0,save:0};
    case 'ausgabe':  return c ? {bank:0,cash:-a,save:0} : {bank:-a,cash:0,save:0};
    case 'einzahlung': return {bank:a,cash:-a,save:0};
    case 'auszahlung': return {bank:-a,cash:a,save:0};
    case 'sparen':    return c ? {bank:0,cash:-a,save:a} : {bank:-a,cash:0,save:a};
    case 'entsparen': return c ? {bank:0,cash:a,save:-a} : {bank:a,cash:0,save:-a};
    case 'geliehen': case 'zurueckbekommen': return c ? {bank:0,cash:a,save:0} : {bank:a,cash:0,save:0};
    case 'verliehen': case 'zurueckgezahlt': return c ? {bank:0,cash:-a,save:0} : {bank:-a,cash:0,save:0};
  }
  return {bank:0,cash:0,save:0};
}
function savingsBalance(excludeId){
  return S.finance.tx.reduce((sum, t) => t.id===excludeId ? sum : sum + effect(t).save, S.finance.start.save || 0);
}
const sortTx = list => list.slice().sort((x,y) => x.date===y.date ? (x.created||0)-(y.created||0) : (x.date<y.date?-1:1));
function touches(t, acct){ if (acct==='all') return true; const e = effect(t); return e[acct] !== 0; }

function renderFinance(){
  if (isKid()) return renderKidFinance();
  const kv = kidsSwitch();
  if (ui.finView !== 'me'){ const kk = S.kids.items.find(x => x.id === ui.finView); if (kk) return kv + renderKidOverview(kk); ui.finView = 'me'; }

  const one = isCombined();

  const all = sortTx(F.tx);
  const bal = {bank:F.start.bank, cash:F.start.cash, save:F.start.save||0};
  const running = {};
  all.forEach(t => { const e = effect(t); bal.bank += e.bank; bal.cash += e.cash; bal.save += e.save; running[t.id] = {bank:bal.bank, cash:bal.cash, save:bal.save}; });
  const total = bal.bank + bal.cash + (sv ? bal.save : 0);

    if (t.type==='auszahlung') tout += t.amount;
    if (t.type==='sparen') sIn += t.amount;
    if (t.type==='entsparen') sOut += t.amount;

  const catList = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,7);

  const acctCard = (k, cls, label, value, sub) => `

  let html = kv + pendingBanner() + `

         + `<div class="acct total-sub"><span class="label"><i></i>Gesamt</span><span class="bal ${total<0?'neg':''}">${euro(total)}</span><span class="sub">inkl. ${euro(bal.save)} Sparen</span></div>`
         : `<div class="acct total"><span class="label"><i></i>Kontostand</span><span class="bal ${total<0?'neg':''}">${euro(total)}</span><span class="sub">Bank und Bargeld zusammen</span></div>`}
  </section>` : `<section class="accounts" aria-label="Kontostände">
    ${acctCard('bank','bank','Bankkonto',bal.bank, ui.acct==='bank'?'Filter aktiv':'Antippen zum Filtern')}
    ${acctCard('cash','cash','Bargeld',bal.cash, ui.acct==='cash'?'Filter aktiv':'Antippen zum Filtern')}
    ${acctCard('all','total','Gesamt',total, sv ? (ui.acct==='all'?'inkl. '+euro(bal.save)+' Sparen':'Alle anzeigen') : (ui.acct==='all'?'Alle Konten':'Alle anzeigen'))}
  </section>`}
  <div class="sec-head">
    <div class="monthbar">

    <aside class="side">

        <div><span class="label">Ausgaben</span><span class="v amt neg">${euro(exp)}</span></div>

        ${one ? `<div><span class="label">Buchungen</span><span class="v">${monthTx.length}</span></div>` : `<div><span class="label">Ein- / Auszahlung</span><span class="v" style="font-size:.9rem">${euro(tin)} / ${euro(tout)}</span></div>`}
        ${sv ? `<div><span class="label">Aufs Sparen</span><span class="v save-v">${euro(sIn)}</span></div><div><span class="label">Vom Sparen</span><span class="v">${euro(sOut)}</span></div>` : ''}
      </div>
      ${renderRecurringPanel()}
      <div class="panel cats">
        <span class="label">Ausgaben nach Kategorie</span>
        ${catList.length ? catList.map(([c,v]) => `<div class="cat-row"><span>${esc(c)}</span><span class="num">${euro(v)}</span><div class="bar"><i style="width:${Math.max(3,v/catMax*100)}%"></i></div></div>`).join('') : '<span style="color:var(--muted);font-size:.88rem">Keine Ausgaben in diesem Monat.</span>'}
      </div>
    </aside>
  </div>`;
  return html;
}
function renderLedger(list, running){
  if (!S.finance.tx.length){
    return `<div class="empty"><strong>Noch keine Buchungen</strong>
      ${isCombined() ? 'Trag deine Einnahmen und Ausgaben ein. Unter „Anfangsbestand“ legst du fest, mit welchem Betrag du startest.' : 'Trag Einnahmen und Ausgaben für dein Bankkonto und dein Bargeld ein. Einzahlungen und Abhebungen verschieben Geld zwischen beiden.'}
      <div class="row"><button class="btn primary" data-act="newtx">+ Erste Buchung</button></div></div>`;
  }
  if (!list.length) return `<div class="empty"><strong>Keine Buchungen in diesem Monat</strong>${ui.acct!=='all'?'Filter: '+ACCT[ui.acct]+'. ':''}<div class="row"><button class="btn primary" data-act="newtx">+ Buchung</button></div></div>`;
  const desc = list.slice().reverse();
  const one = isCombined();
  let html = '', cur = '';
  desc.forEach(t => {
    if (t.date !== cur){
      cur = t.date;
      const dayIn = desc.filter(x => x.date===cur);
      html += `<div class="day"><span>${fmtDay(cur)}</span><span>${dayIn.length} ${dayIn.length===1?'Buchung':'Buchungen'}</span></div>`;
    }
    const T = TYPES[t.type] || TYPES.ausgabe;
    let amtCls, amtTxt;
    if (ui.acct==='all'){
      if (t.type==='einnahme'){ amtCls='pos'; amtTxt='+'+euro(t.amount); }
      else if (t.type==='ausgabe'){ amtCls='neg'; amtTxt='−'+euro(t.amount); }
      else if (t.type==='sparen'){ amtCls='neu'; amtTxt='−'+euro(t.amount); }
      else if (t.type==='entsparen'){ amtCls='neu'; amtTxt='+'+euro(t.amount); }
      else if (isLoan(t)){ amtCls='neu'; amtTxt=(loanPlus(t)?'+':'−')+euro(t.amount); }
      else { amtCls='neu'; amtTxt=euro(t.amount); }
    } else {
      const v = effect(t)[ui.acct];
      amtCls = v>=0?'pos':'neg'; amtTxt = (v>=0?'+':'−')+euro(Math.abs(v));
    }
    const accName = t.account==='cash' ? 'Bargeld' : 'Bank', accCls = t.account==='cash' ? 'cash' : 'bank';
    const saveTag = '<span class="tag save"><i></i>Sparen</span>';
    const acctTag = isSave(t) ? (one ? saveTag : t.type==='sparen' ? `<span class="tag ${accCls}"><i></i>${accName}</span>→${saveTag}` : `${saveTag}→<span class="tag ${accCls}"><i></i>${accName}</span>`)
      : one ? '' : (T.cls==='transfer')
      ? `<span class="tag ${t.type==='einzahlung'?'cash':'bank'}"><i></i>${t.type==='einzahlung'?'Bargeld':'Bank'}</span>→<span class="tag ${t.type==='einzahlung'?'bank':'cash'}"><i></i>${t.type==='einzahlung'?'Bank':'Bargeld'}</span>`
      : `<span class="tag ${t.account}"><i></i>${t.account==='cash'?'Bargeld':'Bank'}</span>`;
    const title = isLoan(t) ? loanTitle(t) : t.text || (t.type==='sparen' ? 'Aufs Sparen gelegt' : t.type==='entsparen' ? 'Vom Sparen genommen' : T.cls==='transfer' ? (t.type==='einzahlung'?'Bargeld eingezahlt':'Geld abgehoben') : T.label);
    const run = !running[t.id] ? '' : ui.acct!=='all' ? `<span class="run">${euro(running[t.id][ui.acct])}</span>` : one ? `<span class="run">${euro(running[t.id].bank + running[t.id].cash)}</span>` : '';
    html += `<button class="tx${t.pending?' is-pending':''}" data-act="edittx" data-id="${esc(t.id)}">
      <span class="ico ${T.cls}" aria-hidden="true">${T.sym}</span>
      <span class="t">${esc(title)}</span>
      <span class="amt ${amtCls}">${amtTxt}</span>
      <span class="meta">${t.pending?'<span class="pend-tag">wartet auf Bestätigung</span>':''}${t.rec?'<span class="rec-tag" title="Regelmäßige Buchung">↻</span>':''}${t.beleg?'<span class="rec-tag" title="Beleg gespeichert">📎</span>':''}${acctTag}${t.cat?(one&&!isSave(t)?'<span>':'<span>· ')+esc(t.cat)+'</span>':''}<span>${one && !t.cat && !isSave(t) ? '' : '· '}${T.label}</span></span>
      ${run}
    </button>`;
  });
  return html;
}

/* ---------- Regelmäßige Buchungen ---------- */
const WEEKDAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const RHYTHM = {monthly:'Monatlich', weekly:'Wöchentlich', yearly:'Jährlich'};
const parseIso = x => { const [y,m,d] = x.split('-').map(Number); return new Date(y, m-1, d); };
const dim = (y,m) => new Date(y, m, 0).getDate();
function occAfter(r, after){
  if (!r.start) return null;
  const st = parseIso(r.start), sy = st.getFullYear(), sm = st.getMonth()+1, sd = st.getDate();
  const ok = dt => dt >= r.start && (!after || dt > after);
  let res = null;
  if (r.rhythm === 'weekly'){
    const k = after && after >= r.start ? Math.floor(daysBetween(r.start, after)/7) + 1 : 0;
    res = iso(new Date(sy, sm-1, sd + 7*k));
  } else if (r.rhythm === 'yearly'){
    const fromY = after ? Math.max(sy, parseIso(after).getFullYear()) : sy;
    for (let y = fromY; y < fromY + 3; y++){ const dt = iso(new Date(y, sm-1, Math.min(sd, dim(y, sm)))); if (ok(dt)){ res = dt; break; } }
  } else {
    const a = after ? parseIso(after) : st;
    let i = Math.max(0, (a.getFullYear()-sy)*12 + (a.getMonth()+1-sm));
    for (let n = 0; n < 3; n++, i++){
      const b = new Date(sy, sm-1+i, 1), y = b.getFullYear(), m = b.getMonth()+1;
      const dt = iso(new Date(y, m-1, Math.min(r.day || sd, dim(y, m))));
      if (ok(dt)){ res = dt; break; }
    }
  }
  if (res && r.end && res > r.end) return null;
  return res;
}
function runRecurring(){
  const F = S.finance; if (!F.recurring || !F.recurring.length) return 0;
  const t0 = today(); let made = 0;
  F.recurring.forEach(r => {
    if (r.paused) return;
    let next = occAfter(r, r.last || null), guard = 0;
    while (next && next <= t0 && guard++ < 400){
      F.tx.push({id:newId(), created:Date.now()+made, type:r.type, amount:r.amount, date:next, text:r.text, cat:r.cat||'', account:r.account||'bank', rec:r.id});
      r.last = next; made++;
      next = occAfter(r, next);
    }
  });
  return made;
}
function recSummary(r){
  const st = r.start ? parseIso(r.start) : new Date();
  if (r.rhythm === 'weekly') return 'Jeden ' + WEEKDAYS[st.getDay()];
  if (r.rhythm === 'yearly') return 'Jährlich am ' + st.getDate() + '. ' + MONTHS[st.getMonth()];
  return 'Monatlich am ' + (r.day || st.getDate()) + '.';
}

const LOAN_TYPES = ['verliehen','geliehen','zurueckbekommen','zurueckgezahlt'];
const isLoan = t => LOAN_TYPES.includes(t.type);
const loanPlus = t => t.type==='geliehen' || t.type==='zurueckbekommen';
function loanTitle(t){
  const w = t.who || '?';
  return ({verliehen:'An ' + w + ' verliehen', geliehen:'Von ' + w + ' geliehen', zurueckbekommen:'Von ' + w + ' zurückbekommen', zurueckgezahlt:'An ' + w + ' zurückgezahlt'})[t.type] || 'Geliehen/verliehen';
}
// Offene Posten aus einer Buchungsliste
function loanList(txs){
  const loans = txs.filter(t => t.type==='verliehen' || t.type==='geliehen');
  return loans.map(l => {
    const back = txs.filter(t => t.loanId===l.id);
    const paid = back.reduce((a,t) => a + t.amount, 0);
    return {l, back, open: Math.max(0, l.amount - paid)};
  });
}
const loanSums = items => items.reduce((s, x) => { if (x.open > 0){ if (x.l.type==='verliehen') s.out += x.open; else s.in += x.open; s.n++; } return s; }, {out:0, in:0, n:0});
function lendPanel(){
  const items = loanList(S.finance.tx), sum = loanSums(items);
  const open = !!ui.lendOpen;

  const t0 = today();
  const head = `<button type="button" class="lend-h" data-act="lend-toggle" aria-expanded="${open}">
      <span class="lend-ht"><b>🤝 Geliehen &amp; verliehen</b><small>${!sum.n ? 'Gerade nichts offen' : open ? sum.n + ' offen' : [sum.out ? 'bekomme ich noch <b class="pos-t">' + euro(sum.out) + '</b>' : '', sum.in ? 'muss ich zurückgeben <b class="neg-t">' + euro(sum.in) + '</b>' : ''].filter(Boolean).join(' · ')}</small></span>
      <span class="lend-chev" aria-hidden="true">${open ? '▴' : '▾'}</span>
    </button>`;
  if (!open) return `<section class="lend">${head}</section>`;
  return `<section class="lend is-open">${head}
    <div class="lend-sum">
      <div><small>Bekomme ich noch</small><b class="pos-t">${euro(sum.out)}</b></div>
      <div><small>Muss ich zurückgeben</small><b class="neg-t">${euro(sum.in)}</b></div>
    </div>
    ${openItems.length ? openItems.map(({l, open: o}) => {
      const out = l.type==='verliehen', late = l.due && l.due < t0;
      const info = [(out ? 'verliehen' : 'geliehen'), euro(o) + (o < l.amount ? ' von ' + euro(l.amount) : ''), 'seit ' + fmtShort(l.date), l.due ? (late ? '<b class="neg-t">war bis ' + fmtShort(l.due) + '</b>' : 'bis ' + fmtShort(l.due)) : ''].filter(Boolean).join(' · ');
      return `<div class="lend-row"><button type="button" class="lend-who" data-act="lend-open" data-id="${esc(l.id)}"><span class="i ${out ? 'out' : 'in'}" aria-hidden="true">${out ? '↗' : '↙'}</span><span><b>${esc(l.who)}</b><small>${info}</small></span></button><button type="button" class="btn sm" data-act="lend-back" data-id="${esc(l.id)}">${out ? 'Zurückbekommen' : 'Zurückgezahlt'}</button></div>`;

    <div class="lend-btns"><button type="button" class="btn" data-act="lend-new" data-dir="out">↗ Ich verleihe</button><button type="button" class="btn" data-act="lend-new" data-dir="in">↙ Ich leihe mir</button></div>

function kidAddDialog(){

      <li>Die Datei an dich schicken, z. B. per AirDrop oder Nachricht, oder in iCloud Drive speichern.</li>
      <li>Hier die Datei auswählen. Ist sie mit der Eltern-PIN verschlüsselt, fragt die App nach der PIN.</li>
    </ol>
    <label class="btn primary welcome-btn">Sicherung des Kindes auswählen …<input type="file" accept=".json,application/json" id="kid-file"></label>
    <p class="hint" style="margin:0">Deine eigenen Daten bleiben dabei unverändert. Die Übersicht ist nur zum Ansehen. Für einen neuen Stand liest du einfach eine neue Sicherung ein.</p>
    <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Abbrechen</button></div>`, () => {});
  form.querySelector('#kid-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) readKidBackup(f, null); });
}
function readKidBackup(file, targetId){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch(e){ toast('Die Datei ist keine gültige Sicherung.'); return; }
    if (!d || d.app !== 'haushaltsplaner'){ toast('Diese Datei ist keine Sicherung dieser App.'); return; }
    if (!d.enc) return storeKid(d, d, targetId);
    if (!cryptoOk()){ toast('Dieser Browser kann die verschlüsselte Sicherung nicht öffnen. Bitte die App über https öffnen.'); return; }
    openDlg(`
      <h3>Sicherung ist verschlüsselt</h3>
      <p class="hint" style="margin:0">Gib die Eltern-PIN ein, die auf dem Gerät des Kindes eingestellt ist${d.wr ? ', oder den Notfall-Code' : ''}.</p>
      <label class="field"><span>PIN${d.wr ? ' oder Notfall-Code' : ''}</span><input class="pin-in" name="secret" type="password" autocomplete="off" autocapitalize="characters" autofocus id="kid-secret"></label>
      <div class="err" id="f-err"></div>
      <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary" type="submit">Öffnen</button></div>`, f => {
        const err = f.querySelector('#f-err'), btn = f.querySelector('button[type=submit]');
        const raw = f.secret.value.trim(); if (!raw) return false;
        const isCode = !/^\d{4,6}$/.test(raw);
        const secret = isCode ? raw.toUpperCase().replace(/[^A-Z0-9]/g,'') : raw;
        const wrap = isCode ? d.wr : d.wp;
        btn.disabled = true; err.textContent = 'Wird geöffnet …';
        (async () => {
          let k;
          try { if (!wrap) throw 0; k = await aesDec(await kdf(secret, d.salt), wrap); }
          catch(e){ btn.disabled = false; f.secret.value = ''; err.textContent = isCode ? 'Der Notfall-Code stimmt nicht.' : 'Die PIN stimmt nicht.'; return; }
          try { const inner = JSON.parse(new TextDecoder().decode(await aesDec(await aesKey(k), d.data))); dlg.close(); storeKid(inner, d, targetId); }
          catch(e){ btn.disabled = false; err.textContent = 'Die Datei wurde verändert oder ist beschädigt.'; }
        })();
        return false;
      });
  };
  r.readAsText(file);
}
function storeKid(inner, outer, targetId){
  const st = inner.settings || {};
  const devId = st.devId || '';
  const data = {devId, exported: outer.exported || inner.exported || new Date().toISOString(), imported: Date.now(),
    finance: normalize('finance', inner.finance),
    cfg: {kid: !!st.kid, kidAccounts: st.kidAccounts || 'cash', kidSave: st.kidSave === 'konto' ? 'konto' : 'schwein', combined: !!st.combined, savings: !!st.savings}};
  const known = S.kids.items.find(k => (targetId && k.id === targetId) || (devId && k.devId === devId));
  if (known){
    if (known.exported && data.exported < known.exported){
      toast('Diese Sicherung ist älter als die bereits eingelesene. Bitte eine neuere Sicherung wählen.');
      if (dlg.open) dlg.close();
      return;
    }
    Object.assign(known, data); save('kids'); addLog('Finanzen von ' + known.name + ' aktualisiert');
    ui.finView = known.id; lsSet('finView', ui.finView);
    if (dlg.open) dlg.close(); render(); toast('Finanzen von ' + known.name + ' aktualisiert');

const OCR_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker = null, ocrLoading = null;
const CAM_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function loadOcrLib(){
  if (window.Tesseract) return Promise.resolve();
  if (ocrLoading) return ocrLoading;
  ocrLoading = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = OCR_SRC; sc.async = true;
    sc.onload = () => res(); sc.onerror = () => { ocrLoading = null; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return ocrLoading;
}
async function getOcrWorker(onProgress){
  if (ocrWorker) return ocrWorker;
  await loadOcrLib();
  ocrWorker = await Tesseract.createWorker('deu', 1, { logger: m => { if (m && typeof m.progress === 'number') onProgress(m.status, m.progress); } });
  // Kassenbons: eine Spalte mit unterschiedlich großen Zeilen, Leerzeichen beibehalten
  try { await ocrWorker.setParameters({ tessedit_pageseg_mode: '4', preserve_interword_spaces: '1' }); } catch(e){}
  return ocrWorker;
}
// Foto verkleinern und in Graustufen umwandeln – das macht die Erkennung schneller und genauer
function prepareImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      try {
        const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
        for (let i = 0; i < p.length; i += 4){ let y = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2]; y = Math.max(0, Math.min(255, (y - 128) * 1.35 + 140)); p[i] = p[i+1] = p[i+2] = y; }
        g.putImageData(d, 0, 0);
      } catch(e){}
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

function parseReceipt(text){
  // Zeilen säubern: Störzeichen am Zeilenende (z. B. „¢“, „‘“, „|“, einzelne Kleinbuchstaben) entfernen
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim().replace(/(\s+[^\sA-Z0-9€*%]{1,2})+$/, '').replace(/^[^\wÄÖÜäöü€-]{1,2}\s+/, '').trim()).filter(Boolean);
  const amounts = l => { const out = []; const re = /(\d{1,5})\s?[,.]\s?(\d{2})(?![\d])/g; let m; while ((m = re.exec(l))) out.push(parseInt(m[1],10)*100 + parseInt(m[2],10)); return out; };
  const EXCL = /(zwischen\s*summe|netto|mwst|m\.?w\.?st|ust\b|steuer|gegeben|r(ü|ue)ckgeld|wechselgeld|zur(ü|ue)ck|rabatt|ersparnis|gespart|punkte|payback|pfandbon)/i;
  const P1 = /(zu\s*zahlen|zahlbetrag|summe|gesamtbetrag|gesamt|endbetrag|rechnungsbetrag|total|betrag\s*eur|eur\s*gesamt)/i;
  const P2 = /(ec[- ]?cash|ec[- ]?karte|girocard|kartenzahlung|kreditkarte|visa|mastercard|maestro|apple\s*pay|google\s*pay|kontaktlos|bar\b|bezahlt)/i;
  const pick = re => {
    const found = [];
    lines.forEach((l, i) => {
      if (!re.test(l) || EXCL.test(l)) return;
      let a = amounts(l);
      if (!a.length && lines[i+1] && !EXCL.test(lines[i+1])) a = amounts(lines[i+1]);
      if (a.length) found.push(a[a.length - 1]);
    });
    return found.length ? Math.max(...found) : 0;
  };
  // Kandidaten für die Summe sammeln – die Summe steht meist mehrfach auf dem Bon (Summe, Kartenzahlung, „EUR 14,62“)
  const cand = new Map();
  const add = (v, w) => { if (v > 0) cand.set(v, (cand.get(v) || 0) + w); };
  const P3 = /^(eur|fur|€)\s*\d/i;
  lines.forEach((l, i) => {
    if (EXCL.test(l)) return;
    const w = P1.test(l) ? 3 : P2.test(l) ? 2 : P3.test(l) ? 2 : 0;
    if (!w) return;
    let a = amounts(l);
    if (!a.length && lines[i+1] && !EXCL.test(lines[i+1])) a = amounts(lines[i+1]);
    if (a.length) add(a[a.length - 1], w);
  });
  const ranked = [...cand.entries()].sort((x, y) => y[1] - x[1] || y[0] - x[0]).map(x => x[0]);
  let amount = ranked[0] || 0, sure = !!amount && (cand.get(amount) >= 3);
  if (!amount){ const all = []; lines.forEach(l => { if (!EXCL.test(l)) all.push(...amounts(l)); }); amount = all.length ? Math.max(...all) : 0; }
  // Datum
  let date = '';

/* ---------- Positionen vom Kassenbon ---------- */
const ITEM_SKIP = /(zwischen\s*summe|summe|gesamt|zu\s*zahlen|zahlbetrag|endbetrag|total|netto|brutto|mwst|m\.?w\.?st|ust\b|steuer|gegeben|r(ü|ue)ckgeld|wechselgeld|bar\b|ec[- ]?cash|karte|girocard|visa|mastercard|maestro|kontaktlos|bezahlt|betrag|posten|artikel\s*anzahl|payback|punkte|bon[- ]?nr|beleg|kasse|terminal|trace|datum|uhrzeit|tse|signatur|seriennr)/i;
function niceName(n){
  n = n.replace(/\s+/g, ' ').replace(/^[*#\-–\s]+|[*#\s]+$/g, '').trim();
  const letters = n.replace(/[^A-Za-zÄÖÜäöüß]/g, '');
  if (letters && letters === letters.toUpperCase()) n = n.toLowerCase().replace(/(^|[\s\-\/(])([a-zäöüß])/g, (m, a, b) => a + b.toUpperCase());
  return n.slice(0, 40);
}
function parseItems(lines, total, shop){
  // Artikel stehen vor der Summe; auch bei schlecht gelesener Summenzeile spätestens vor Zahlungs-/Kartenteil aufhören
  let end = lines.findIndex(l => /(zahlen|summe|gesamtbetrag|gesamt|endbetrag|total|k-?u-?n-?d-?e|terminal|kartenzahlung|girocard|ec[- ]?cash|bar\s*gegeben|gegeben)/i.test(l) && !/zwischen/i.test(l));
  if (end < 0) end = lines.length;
  const LET = /[A-Za-zÄÖÜäöüß]/;
  const letters = x => x.replace(/[^A-Za-zÄÖÜäöüß]/g, '').length;
  const TAIL = String.raw`\s*(?:€|eur)?(?:\s*[A-Z0-9*#]{1,2})?\s*\*?\s*$`;
  const ITEM = new RegExp(String.raw`^(.*?[A-Za-zÄÖÜäöüß].*?)\s+(-?)\s?(\d{1,4})\s?[,.]\s?(\d{2})(?!\d)\s*(-?)` + TAIL, 'i');
  const ITEM_NOSEP = new RegExp(String.raw`^(.*?[A-Za-zÄÖÜäöüß].*?)\s+(\d{3,5})` + TAIL, 'i');   // Komma nicht erkannt, z. B. „1769“
  const PRICE_ONLY = new RegExp(String.raw`^\s*(?:€|eur)?\s*(-?)\s?(\d{1,4})\s?[,.]\s?(\d{2})(?!\d)\s*(-?)` + TAIL, 'i');
  const HEAD = /(str\.|stra(ß|ss)e|weg\b|platz\b|\b\d{5}\b|tel|fax|www|http|@|filiale|markt\b|gmbh|kg\b|ust|steuer|öffnungs|danke|willkommen|kunden)/i;
  const shopRe = shop ? new RegExp(shop.replace(/[^\wäöüß]/gi, '').split('').join('\\s*'), 'i') : null;
  const cents = (sg1, a, b, sg2) => { let v = parseInt(a,10)*100 + parseInt(b,10); return (sg1 === '-' || sg2 === '-') ? -v : v; };
  const okName = n => !ITEM_SKIP.test(n) && letters(n) >= 2 && !(/^\d+\s*(stk|st|x)\b/i.test(n) && letters(n) < 4);
  const clean = n => n.replace(/\s+\d+\s?[,.]\s?\d{2}\s*(?:€|eur)?\s*$/i, '').replace(/\s+\d+\s*(?:stk\.?\s*)?[x×]\s*$/i, '').replace(/\s+[0-9A-Z]$/, '').trim();
  const out = [], nameOnly = [], priceOnly = [];
  for (let i = 0; i < end; i++){
    const l = lines[i];
    let m = l.match(ITEM);
    if (m){ const name = clean(m[1]); if (okName(name)){ const a = cents(m[2], m[3], m[4], m[5]); if (a) out.push({n: niceName(name), a, at: i}); } continue; }
    m = l.match(PRICE_ONLY);
    if (m){ priceOnly.push({i, a: cents(m[1], m[2], m[3], m[4])}); continue; }
    m = l.match(ITEM_NOSEP);
    if (m && okName(clean(m[1])) && !HEAD.test(l)){
      const dg = m[2], alts = [parseInt(dg, 10)];                       // „1769“ → 17,69
      if (dg.length >= 4 && /[7142]/.test(dg[dg.length-3])) alts.push(parseInt(dg.slice(0, -3) + dg.slice(-2), 10));   // Komma als Ziffer gelesen → 1,69
      out.push({n: niceName(clean(m[1])), a: alts[0], alts, at: i}); continue;
    }
    if (LET.test(l) && okName(l) && !/\d{1,2}[.:]\d{2}[.:]\d{2,4}/.test(l) && !HEAD.test(l) && !(shopRe && shopRe.test(l) && letters(l) <= shop.length + 2)) nameOnly.push({i, n: l});
  }
  // Namen ohne Preis + Preise in eigenen Zeilen: direkt darunter oder als eigene Spalte
  const seq = [...nameOnly.map(x => ({t:'N', i:x.i, n:x.n})), ...priceOnly.map(q => ({t:'P', i:q.i, a:q.a}))].sort((x, y) => x.i - y.i);
  const usedN = new Set();
  let k = 0;
  while (k < seq.length){
    if (seq[k].t !== 'N'){ k++; continue; }
    let j = k; while (j < seq.length && seq[j].t === 'N') j++;
    let m2 = j; while (m2 < seq.length && seq[m2].t === 'P') m2++;
    const names = seq.slice(k, j), prices = seq.slice(j, m2);
    if (prices.length === 1 && names[names.length-1].i + 1 === prices[0].i){ const nm = names[names.length-1]; usedN.add(nm.i); if (prices[0].a) out.push({n: niceName(clean(nm.n)), a: prices[0].a, at: nm.i}); }
    else if (prices.length >= 2){ const c = Math.min(names.length, prices.length), ns = names.slice(names.length - c); for (let q = 0; q < c; q++){ usedN.add(ns[q].i); if (prices[q].a) out.push({n: niceName(clean(ns[q].n)), a: prices[q].a, at: ns[q].i}); } }
    k = Math.max(m2, j);
  }
  // Übrige Namen ohne Preis: aufeinanderfolgende Zeilen gehören zu einem Artikel
  const groups = [];
  nameOnly.filter(x => !usedN.has(x.i)).forEach(x => { const g = groups[groups.length-1]; if (g && g.last + 1 === x.i){ g.last = x.i; g.lines.push(x.n); } else groups.push({first: x.i, last: x.i, lines: [x.n]}); });
  // Mit der Summe abgleichen: mehrdeutige Preise auflösen, genau einen fehlenden Preis ergänzen
  let filled = false;
  if (total > 0 && out.length){
    const amb = out.filter(x => x.alts && x.alts.length > 1).slice(0, 6);
    let best = null;
    for (let mask = 0; mask < (1 << amb.length); mask++){
      amb.forEach((x, b) => { x.a = x.alts[(mask >> b) & 1]; });
      const sum = out.reduce((s, x) => s + x.a, 0), rest = total - sum;
      const sc = Math.abs(rest) < 1 ? 3 : (rest > 0 && groups.length === 1 ? 2 : 0);
      if (!best || sc > best.sc || (sc === best.sc && Math.abs(rest) < Math.abs(best.rest))) best = {sc, rest, mask};
    }
    amb.forEach((x, b) => { x.a = x.alts[(best.mask >> b) & 1]; });
    if (best.sc === 2){
      const g = groups[0], nm = g.lines.map(l => clean(l)).filter(l => letters(l) >= 3);
      out.push({n: niceName(nm[nm.length-1] || g.lines[g.lines.length-1]), a: best.rest, at: g.first, guess: true}); filled = true;
    }
  }
  // Eine „Position“ mit genau der Summe ist meist die Summenzeile selbst
  if (total > 0 && out.length > 1){ for (let i = out.length - 1; i >= 0; i--) if (out[i].a === total && !out[i].guess) out.splice(i, 1); }
  const items = out.sort((x, y) => x.at - y.at).map(({n, a, guess}) => guess ? {n, a, g: 1} : {n, a}).slice(0, 60);
  return {items, filled};
}

const ADULT_ITEM_CATS = ['Lebensmittel','Haushalt','Kinder','Gesundheit','Kleidung','Freizeit','Auto & Tanken','Geschenke','Sonstiges'];

const DEFAULT_PERIODS = [['08:00','08:45'],['08:50','09:35'],['09:55','10:40'],['10:45','11:30'],['11:50','12:35'],['12:40','13:25']];

const activePlan = () => S.schedule.plans.find(p => p.id===S.schedule.active) || S.schedule.plans[0];
const toMin = t => { const [h,m] = String(t||'').split(':').map(Number); return h*60+m; };

function renderSchedule(){
  const plans = S.schedule.plans;
  if (!plans.length){
    return `<div class="sec-head"><h2>Stundenplan</h2></div>

  }
  const P = activePlan();
  const nDays = P.saturday ? 6 : 5;

  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const curPer = P.periods.findIndex(p => nowMin >= toMin(p[0]) && nowMin <= toMin(p[1]));
