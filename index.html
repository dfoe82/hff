<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organizer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1514" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.3.1">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=1.3.1">
<title>Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: ein App-Rahmen mit drei Bereichen; oben Tabs am Desktop, unten Tab-Leiste am Handy; Kontostände zuerst, Details darunter */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e4eae8; --ink:#16201e; --muted:#5a6966; --line:#d6dfdc;
  --accent:#0d6b61; --accent-ink:#ffffff;
  --bank:#2b5c9c; --cash:#9a6a0c; --pos:#25764a; --neg:#b0373a; --warn:#a85d00;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px; --shadow:0 1px 2px rgb(20 40 36 / .06), 0 6px 20px rgb(20 40 36 / .06);
  --s0:#d2453f; --s1:#2b6fd6; --s2:#2c9a5b; --s3:#c98a12; --s4:#8a4fc7; --s5:#14918f; --s6:#d0567f; --s7:#6b7b2a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201e; --sunk:#131a19; --ink:#e4ebe9; --muted:#93a29e; --line:#2a3532;
  --accent:#43b6a7; --accent-ink:#06201c;
  --bank:#78a6e6; --cash:#e2ad4c; --pos:#5fc78c; --neg:#f07b7b; --warn:#f0a24a;
  --shadow:0 1px 2px rgb(0 0 0 / .4);
  --s0:#ef6d66; --s1:#6fa0f0; --s2:#5cc785; --s3:#e6b04a; --s4:#b088ea; --s5:#4fc4c0; --s6:#ec85a8; --s7:#a8b85a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --sunk:#131a19; --ink:#e4ebe9; --muted:#93a29e; --line:#2a3532;
  --accent:#43b6a7; --accent-ink:#06201c;
  --bank:#78a6e6; --cash:#e2ad4c; --pos:#5fc78c; --neg:#f07b7b; --warn:#f0a24a;
  --shadow:0 1px 2px rgb(0 0 0 / .4);
  --s0:#ef6d66; --s1:#6fa0f0; --s2:#5cc785; --s3:#e6b04a; --s4:#b088ea; --s5:#4fc4c0; --s6:#ec85a8; --s7:#a8b85a;
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* Kopf */
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--pos)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.tabs svg{width:18px;height:18px;flex:none}
@media (max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 10px;border-radius:10px;flex:1}
  nav.tabs button[aria-selected="true"]{box-shadow:none;background:transparent;color:var(--accent)}
  nav.tabs svg{width:22px;height:22px}
}

/* Allgemein */
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-block:22px 12px}
.sec-head h2{font-size:1.15rem;font-weight:700;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--neg)}
.btn.danger[data-armed]{background:var(--neg);border-color:var(--neg);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Finanzen */
.accounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.accounts.one{grid-template-columns:1fr}

.acct{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;cursor:pointer}
.acct[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.acct .label{display:flex;align-items:center;gap:7px}
.acct .label i{width:10px;height:10px;border-radius:3px;display:inline-block}
.acct.bank{color:var(--bank)} .acct.cash{color:var(--cash)} .acct.total{color:var(--ink)}
.acct.bank .label i{background:var(--bank)} .acct.cash .label i{background:var(--cash);border-radius:50%} .acct.total .label i{background:var(--ink)}
.acct .bal{font-family:var(--f-num);font-weight:600;font-size:1.45rem;color:var(--ink);overflow-wrap:anywhere}
.acct .sub{font-size:.8rem;color:var(--muted)}
.bal.neg{color:var(--neg)!important}
@media (max-width:560px){.accounts{grid-template-columns:1fr 1fr}.acct.total{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}.acct .bal{font-size:1.2rem}}

.accounts.one .acct.total{cursor:default;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px}
.accounts.one .acct .bal{font-size:1.9rem}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .m{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:9.5em;text-align:center}
.fin-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.fin-grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stats > div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .v{font-family:var(--f-num);font-weight:600;font-size:1.05rem}
.cats{padding:14px;display:flex;flex-direction:column;gap:10px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.88rem}
.cat-row .bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.cat-row .bar i{display:block;height:100%;background:var(--neg);opacity:.75;border-radius:3px}
.side{display:flex;flex-direction:column;gap:12px}

.ledger{overflow:hidden}
.day{padding:8px 14px;background:var(--sunk);font-size:.78rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.tx{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.day + .tx{border-top:0}
.tx:hover{background:var(--sunk)}
.tx .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:1rem;background:var(--sunk);color:var(--muted);grid-row:span 2}
.tx .ico.einnahme{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.tx .ico.ausgabe{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}
.tx .ico.transfer{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:2}
.tx .amt{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.tx .run{font-family:var(--f-num);font-size:.75rem;color:var(--muted);text-align:right;grid-column:3;white-space:nowrap}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)} .amt.neu{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.tag.bank{color:var(--bank)} .tag.cash{color:var(--cash)}
.tag i{width:7px;height:7px;display:inline-block;border-radius:2px;background:currentColor}
.tag.cash i{border-radius:50%}

/* Dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(10 20 18 / .45)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:20px;overflow:auto;max-height:calc(100dvh - 24px)}
.dlg h3{font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible + span{outline:2px solid var(--accent)}
.hint{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.dlg-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-actions .spacer{margin-right:auto}
.err{color:var(--neg);font-size:.85rem;min-height:1em}
.amount-in{font-family:var(--f-num)!important;font-size:1.3rem!important;font-weight:600}

/* Stundenplan */
.tt-scroll{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px;table-layout:fixed}
table.tt th{font-size:.8rem;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center}
table.tt th.today{color:var(--accent)}
table.tt th.today span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px}
table.tt td.per{width:78px;text-align:left;vertical-align:middle;padding:4px}
.per b{display:block;font-family:var(--f-display);font-size:1rem}
.per small{font-family:var(--f-num);font-size:.7rem;color:var(--muted);line-height:1.25;display:block}
td.per.now b{color:var(--accent)}
.cell{width:100%;min-height:58px;height:100%;border-radius:10px;border:1px dashed var(--line);background:transparent;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;color:var(--muted);overflow:hidden}
.cell.filled{border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink)}
.cell b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.now{box-shadow:0 0 0 2px var(--accent)}
.cell .plus{font-size:1.1rem;opacity:.4;text-align:center}
.break td{padding:0}
.break div{font-size:.7rem;color:var(--muted);text-align:center;border-top:1px dotted var(--line);line-height:1;padding-top:3px}
.tt-desk{display:block} .tt-mob{display:none}
@media (max-width:640px){.tt-desk{display:none}.tt-mob{display:block}}
.daytabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:10px}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:600;color:var(--muted)}
.daytabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daytabs button.today{color:var(--accent)}
.daytabs button.today[aria-pressed="true"]{color:var(--bg)}
.daylist{display:flex;flex-direction:column;gap:6px}
.dl-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:stretch}

/* Aufgaben */
.quick{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px auto;gap:8px;padding:10px}
.quick input,.quick select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-width:0;font-size:16px;width:100%}
@media (max-width:640px){.quick{grid-template-columns:1fr 1fr}.quick input[name=title]{grid-column:1/-1}.quick .btn{grid-column:1/-1;justify-content:center}}
.group-h{display:flex;align-items:baseline;gap:8px;padding:14px 14px 6px;font-family:var(--f-display);font-weight:700}
.group-h small{font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:.8rem}
.group-h.over{color:var(--neg)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;grid-row:span 2}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--pos);border-color:var(--pos)}
.task.done .check svg{opacity:1;color:var(--surface)}
.task .tt{border:0;background:transparent;padding:0;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .tt{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .meta{grid-column:2;font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.task .meta .over{color:var(--neg);font-weight:600}
.task .meta .tod{color:var(--accent);font-weight:600}
.prio{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;grid-row:span 2}
.prio.hoch{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.prio.niedrig{background:var(--sunk);color:var(--muted)}
.prio.normal{visibility:hidden}

#backupBtn{order:3}
.brand{min-width:0}
@media (max-width:480px){.brand .sync > span{display:none}.brand h1{font-size:1.25rem}}
.brand h1{overflow:hidden;text-overflow:ellipsis}
#settingsBtn{color:var(--muted)}
#settingsBtn{order:4}
#backupBtn.due{border-color:var(--warn);color:var(--warn)}
#backupBtn.due::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media (max-width:700px){header.top{flex-wrap:nowrap}}
/* Hausaufgaben */
.hw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);position:relative}
.hw::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.hw .check{grid-row:span 2}
.hw.done .check{background:var(--pos);border-color:var(--pos)}
.hw.done .check svg{opacity:1;color:var(--surface)}
.hw .body{border:0;background:transparent;padding:0;text-align:left;display:flex;gap:8px;align-items:baseline;min-width:0}
.hw .subj{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);white-space:nowrap;flex:none}
.hw .txt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hw.done .txt{text-decoration:line-through;color:var(--muted);font-weight:500}
.hw .meta{grid-column:2;font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.hw .meta .over{color:var(--neg);font-weight:600}
.hw .meta .tod{color:var(--accent);font-weight:600}
.hw .meta .kid{font-weight:600;color:var(--ink)}
.hw-next{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
body.single .wrap{padding-bottom:32px}
body.single .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:50;max-width:calc(100vw - 32px)}
@media (min-width:701px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="appTitle">Organizer</h1><span class="sync" id="sync"><i></i><span>Lädt …</span></span></div>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="btn sm" id="backupBtn" type="button" aria-label="Daten sichern">Sichern</button>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button role="tab" data-tab="finanzen" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>Finanzen</button>
      <button role="tab" data-tab="stundenplan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M9 9.5v11M15 9.5v11M8 2.5v4M16 2.5v4"/></svg>Stundenplan</button>
      <button role="tab" data-tab="hausaufgaben" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H19v-5"/><path d="M9 8h6M9 11.5h4"/></svg>Hausaufgaben</button>
      <button role="tab" data-tab="aufgaben" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l2 2 3.5-3.5M4 15.5l2 2 3.5-3.5M13 7h7M13 16h7"/></svg>Aufgaben</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const newId = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmtEUR = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const euro = c => fmtEUR.format((c||0)/100);
const parseAmt = s => {
  s = String(s||'').trim().replace(/[\s€]/g,'');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n*100) : NaN;
};
const amtInput = c => c ? (c/100).toFixed(2).replace('.',',') : '';
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DAYS = ['Mo','Di','Mi','Do','Fr','Sa'];
const DAYS_LONG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const fmtDay = isoStr => { const d = new Date(isoStr+'T12:00:00'); return d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'}); };
const fmtShort = isoStr => { const d = new Date(isoStr+'T12:00:00'); return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}); };
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Zustand ---------- */
/* ---------- Version ---------- */
const APP_VERSION = '1.3.1';
const SECTIONS = [['finanzen','Finanzen'],['stundenplan','Stundenplan'],['hausaufgaben','Hausaufgaben'],['aufgaben','Aufgaben']];
const APP_BUILD = '2026-10-07';
const CHANGELOG = [
  ['1.3.1', '07.10.2026', ['Neues App-Symbol: Ringbuch mit Registern und Checkliste']],
  ['1.3.0', '07.10.2026', ['Bereiche (Finanzen, Stundenplan, Hausaufgaben, Aufgaben) einzeln ein- und ausschaltbar']],
  ['1.2.0', '07.10.2026', ['Neue Einstellung: Bankkonto und Bargeld zu einem Konto zusammenlegen']],
  ['1.1.0', '07.10.2026', ['App heißt jetzt „Organizer“', 'Beispieldaten entfernt']],
  ['1.0.0', '07.10.2026', ['Erste nummerierte Version', 'Name der App in den Einstellungen änderbar', 'Bereiche: Finanzen (Bankkonto & Bargeld), Stundenplan, Hausaufgaben, Aufgaben']]
];
const DEFAULT_NAME = 'Organizer';
const KEYS = ['finance','schedule','tasks','homework','settings'];
const DEF = {
  finance: { start:{bank:0,cash:0}, tx:[] },
  schedule: { plans:[], active:null },
  tasks: { items:[] },
  homework: { items:[] },
  settings: { appName:'', combined:false, hidden:[] }
};
function normalize(key, v){
  const d = clone(DEF[key]);
  if (!v || typeof v !== 'object') return d;
  if (key==='finance'){ d.start = {bank:+(v.start?.bank)||0, cash:+(v.start?.cash)||0}; d.tx = Array.isArray(v.tx)?v.tx:[]; }
  if (key==='schedule'){ d.plans = Array.isArray(v.plans)?v.plans:[]; d.active = v.active ?? d.plans[0]?.id ?? null; }
  if (key==='settings'){ d.appName = typeof v.appName==='string' ? v.appName.slice(0,40) : ''; d.combined = !!v.combined; d.hidden = Array.isArray(v.hidden) ? v.hidden.filter(x => SECTIONS.some(s => s[0]===x)) : []; if (d.hidden.length >= SECTIONS.length) d.hidden = []; }
  if (key==='tasks' || key==='homework'){ d.items = Array.isArray(v.items)?v.items:[]; }
  return d;
}
const hasContent = (key, v) => key==='finance' ? (v.tx.length>0 || v.start.bank!==0 || v.start.cash!==0)
  : key==='schedule' ? v.plans.length>0 : key==='settings' ? (!!v.appName || v.combined || v.hidden.length>0) : v.items.length>0;

const LS = 'haushaltsplaner.v1.';
const lsGet = k => { try { const v = localStorage.getItem(LS+k); return v ? JSON.parse(v) : null; } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(LS+k, JSON.stringify(v)); } catch(e){} };

const S = {};
KEYS.forEach(k => S[k] = normalize(k, lsGet(k)));

const now = new Date();
const ui = {
  tab: (lsGet('tab') || 'finanzen'),
  month: now.getFullYear()+'-'+pad(now.getMonth()+1),
  acct: 'all',
  day: Math.min(Math.max((now.getDay()+6)%7,0),5),
  taskFilter: 'offen',
  hwFilter: 'offen',
  hwPlan: 'all'
};
if (ui.day > 4 && now.getDay()===0) ui.day = 0;

/* ---------- Speicherung: nur auf diesem Gerät (localStorage) ---------- */
let storageOk = true;
function save(key){
  try { localStorage.setItem(LS+key, JSON.stringify(S[key])); storageOk = true; }
  catch(e){ storageOk = false; toast('Speichern nicht möglich – privates Surfen aus? Bitte Sicherung exportieren.'); }
  try { localStorage.setItem(LS+'changed', String(Date.now())); } catch(e){}
  updateBackupHint();
}
function setSync(on, text){
  const el = $('#sync'); el.classList.toggle('on', on); el.querySelector('span').textContent = text; el.title = text;
}
function initLocal(){
  try { localStorage.setItem(LS+'probe','1'); localStorage.removeItem(LS+'probe'); setSync(true,'Lokal gespeichert'); }
  catch(e){ storageOk = false; setSync(false,'Speichern nicht möglich'); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  updateBackupHint();
}

/* ---------- Sicherung (Export / Import als Datei) ---------- */
function updateBackupHint(){
  const btn = document.getElementById('backupBtn'); if (!btn) return;
  const last = +(lsGet('lastBackup')||0), changed = +(lsGet('changed')||0);
  const any = KEYS.some(k => hasContent(k, S[k]));
  btn.classList.toggle('due', any && changed > last && Date.now() - last > 7*864e5);
}
function backupData(){ return {app:'haushaltsplaner', version:1, appVersion:APP_VERSION, exported:new Date().toISOString(), finance:S.finance, schedule:S.schedule, tasks:S.tasks, homework:S.homework, settings:S.settings}; }
async function exportBackup(){
  const json = JSON.stringify(backupData(), null, 2);
  const name = (appName().toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'organizer')+'-sicherung-'+today()+'.json';
  const file = new File([json], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:name});
    } else {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    lsSet('lastBackup', Date.now()); updateBackupHint(); toast('Sicherung erstellt');
  } catch(e){ if (e && e.name === 'AbortError') return; toast('Sicherung konnte nicht erstellt werden.'); }
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch(e){ toast('Die Datei ist keine gültige Sicherung.'); return; }
    if (!d || d.app !== 'haushaltsplaner'){ toast('Diese Datei ist keine Sicherung dieser App.'); return; }
    KEYS.forEach(k => { if (k==='settings' && !d[k]) return; S[k] = normalize(k, d[k]); save(k); });
    lsSet('lastBackup', Date.now()); updateBackupHint();
    if (dlg.open) dlg.close(); render(); toast('Sicherung wiederhergestellt');
  };
  r.readAsText(file);
}
function backupDialog(){
  const last = +(lsGet('lastBackup')||0);
  const n = S.finance.tx.length, t = S.tasks.items.length, p = S.schedule.plans.length, h = S.homework.items.length;
  const form = openDlg(`
    <h3>Daten sichern</h3>
    <p class="hint">Alles wird nur in diesem Browser auf diesem Gerät gespeichert. Leerst du die Browserdaten oder wechselst das Gerät, ist es weg. Exportiere deshalb regelmäßig eine Sicherung, z. B. in iCloud Drive.</p>
    <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <div><span class="label">Buchungen</span><span class="v">${n}</span></div>
      <div><span class="label">Pläne</span><span class="v">${p}</span></div>
      <div><span class="label">Hausaufgaben</span><span class="v">${h}</span></div>
      <div><span class="label">Aufgaben</span><span class="v">${t}</span></div>
    </div>
    <p style="margin:0;color:var(--muted);font-size:.88rem">Letzte Sicherung: <b>${last ? new Date(last).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}) : 'noch keine'}</b></p>
    <button type="button" class="btn primary" id="bk-export" style="justify-content:center">Sicherung exportieren</button>
    <label class="btn" style="justify-content:center;position:relative">Sicherung wiederherstellen …
      <input type="file" accept=".json,application/json" id="bk-file" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    <p class="hint" style="margin:0">Beim Wiederherstellen werden die aktuellen Daten auf diesem Gerät durch die Sicherung ersetzt.</p>
    <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Schließen</button></div>`, () => {});
  form.querySelector('#bk-export').addEventListener('click', exportBackup);
  form.querySelector('#bk-file').addEventListener('change', e => { const f = e.target.files[0]; if (f) importBackup(f); });
}

/* ---------- UI-Grundlagen ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 2600); }
const dlg = $('#dlg');
function openDlg(html, onSubmit){
  dlg.innerHTML = '<form class="dlg" novalidate>'+html+'</form>';
  const form = dlg.querySelector('form');
  form.addEventListener('submit', e => { e.preventDefault(); if (onSubmit(form) !== false) closeDlg(); });
  form.addEventListener('click', e => { if (e.target.closest('[data-close]')){ e.preventDefault(); closeDlg(); } });
  dlg.showModal();
  const first = form.querySelector('[autofocus]'); if (first && matchMedia('(hover:hover)').matches) first.focus();
  return form;
}
function closeDlg(){ dlg.close(); render(); }
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
/* Zweistufige Bestätigung statt confirm() */
function armed(btn, label){
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label || 'Wirklich? Nochmal tippen';
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 3000);
  return false;
}

/* ---------- Navigation ---------- */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => { ui.tab = b.dataset.tab; lsSet('tab', ui.tab); render(); window.scrollTo(0,0); }));
/* ---------- Einstellungen: Name & Version ---------- */
const appName = () => (S.settings && S.settings.appName) || DEFAULT_NAME;
const isCombined = () => !!(S.settings && S.settings.combined);
const isVisible = k => !(S.settings && S.settings.hidden || []).includes(k);
function applySections(){
  const vis = SECTIONS.map(x => x[0]).filter(isVisible);
  if (!vis.includes(ui.tab)) ui.tab = vis[0] || 'finanzen';
  document.querySelectorAll('nav.tabs button').forEach(b => { b.hidden = !isVisible(b.dataset.tab); });
  const nav = document.querySelector('nav.tabs'); nav.hidden = vis.length < 2;
  document.body.classList.toggle('single', vis.length < 2);
}
const isTransfer = t => t.type==='einzahlung' || t.type==='auszahlung';
function applyName(){
  const n = appName();
  const h = document.getElementById('appTitle'); if (h && h.textContent !== n) h.textContent = n;
  if (document.title !== n) document.title = n;
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (m) m.setAttribute('content', n);
}
function settingsDialog(){
  const form = openDlg(`
    <h3>Einstellungen</h3>
    <label class="field"><span>Name der App</span><input name="appName" value="${esc(appName())}" maxlength="40" placeholder="${esc(DEFAULT_NAME)}" autofocus id="set-name"></label>
    <p class="hint" style="margin:0">Erscheint als Überschrift und im Browser-Tab. Leer lassen für „${esc(DEFAULT_NAME)}“.</p>
    <fieldset style="border:0;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:8px">
      <legend class="label" style="margin-bottom:8px">Bereiche anzeigen</legend>
      ${SECTIONS.map(([k,l]) => `<label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" name="sec" value="${k}" id="set-sec-${k}" ${isVisible(k)?'checked':''} style="width:18px;height:18px;flex:none">${l}</label>`).join('')}
      <span style="font-size:.85rem;color:var(--muted)">Ausgeblendete Bereiche behalten ihre Daten. Mindestens ein Bereich bleibt sichtbar.</span>
    </fieldset>
    <label style="display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:4px" id="set-combined-row"><input type="checkbox" name="combined" id="set-combined" ${isCombined()?'checked':''} style="margin-top:3px;width:18px;height:18px;flex:none"><span>Bankkonto und Bargeld zusammenlegen<span style="display:block;font-weight:400;font-size:.85rem;color:var(--muted)">Nur ein Kontostand, ohne Auswahl des Kontos und ohne Ein- und Auszahlungen. Bestehende Buchungen bleiben erhalten; du kannst jederzeit zurückschalten.</span></span></label>
    <div class="err" id="f-err"></div>
    <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>
    <div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="label">Version</span><span class="num" style="font-weight:600">${APP_VERSION} <span style="color:var(--muted);font-weight:400">· ${new Date(APP_BUILD+'T12:00:00').toLocaleDateString('de-DE')}</span></span></div>
      ${CHANGELOG.map(([v,d,items]) => `<div style="font-size:.86rem"><b class="num">${v}</b> <span style="color:var(--muted)">${d}</span><ul style="margin:4px 0 0;padding-left:18px;color:var(--muted)">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}
    </div>`, f => {
      const n = f.appName.value.trim().replace(/\s+/g,' ');
      S.settings.appName = (n && n !== DEFAULT_NAME) ? n : '';
      const shown = [...f.querySelectorAll('input[name=sec]:checked')].map(i => i.value);
      if (!shown.length){ f.querySelector('#f-err').textContent = 'Bitte mindestens einen Bereich auswählen.'; return false; }
      S.settings.hidden = SECTIONS.map(x => x[0]).filter(k => !shown.includes(k));
      S.settings.combined = f.combined.checked;
      save('settings'); applyName(); toast('Einstellungen gespeichert');
    });
}

function render(){
  applyName();
  applySections();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===ui.tab)));
  const m = $('#main');
  if (ui.tab==='finanzen') m.innerHTML = renderFinance();
  else if (ui.tab==='stundenplan') m.innerHTML = renderSchedule();
  else if (ui.tab==='hausaufgaben') m.innerHTML = renderHomework();
  else m.innerHTML = renderTasks();
}

/* =========================================================
   FINANZEN
   ========================================================= */
const TYPES = {
  einnahme:  {label:'Einnahme',  sym:'+', cls:'einnahme'},
  ausgabe:   {label:'Ausgabe',   sym:'−', cls:'ausgabe'},
  einzahlung:{label:'Einzahlung',sym:'⇢', cls:'transfer', note:'Bargeld → Bank'},
  auszahlung:{label:'Auszahlung',sym:'⇠', cls:'transfer', note:'Bank → Bargeld'}
};
const ACCT = {bank:'Bankkonto', cash:'Bargeld'};
const DEFAULT_CATS = ['Lebensmittel','Haushalt','Wohnen','Auto & Tanken','Kinder','Freizeit','Gesundheit','Versicherungen','Kleidung','Geschenke','Gehalt','Kindergeld','Sonstiges'];

function effect(t){
  const a = t.amount||0;
  switch(t.type){
    case 'einnahme': return t.account==='cash' ? {bank:0,cash:a} : {bank:a,cash:0};
    case 'ausgabe':  return t.account==='cash' ? {bank:0,cash:-a} : {bank:-a,cash:0};
    case 'einzahlung': return {bank:a,cash:-a};
    case 'auszahlung': return {bank:-a,cash:a};
  }
  return {bank:0,cash:0};
}
const sortTx = list => list.slice().sort((x,y) => x.date===y.date ? (x.created||0)-(y.created||0) : (x.date<y.date?-1:1));
function touches(t, acct){ if (acct==='all') return true; const e = effect(t); return e[acct] !== 0; }

function renderFinance(){
  const F = S.finance;
  const one = isCombined();
  if (one) ui.acct = 'all';
  const all = sortTx(F.tx);
  const bal = {bank:F.start.bank, cash:F.start.cash};
  const running = {};
  all.forEach(t => { const e = effect(t); bal.bank += e.bank; bal.cash += e.cash; running[t.id] = {bank:bal.bank, cash:bal.cash}; });
  const total = bal.bank + bal.cash;

  const [y,m] = ui.month.split('-').map(Number);
  const monthTx = all.filter(t => t.date.startsWith(ui.month) && touches(t, ui.acct) && !(one && isTransfer(t)));
  let inc=0, exp=0, tin=0, tout=0; const cats = {};
  monthTx.forEach(t => {
    if (t.type==='einnahme') inc += t.amount;
    if (t.type==='ausgabe'){ exp += t.amount; const c = t.cat || 'Ohne Kategorie'; cats[c] = (cats[c]||0) + t.amount; }
    if (t.type==='einzahlung') tin += t.amount;
    if (t.type==='auszahlung') tout += t.amount;
  });
  const catList = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const catMax = catList[0]?.[1] || 1;

  const acctCard = (k, cls, label, value, sub) => `
    <button class="acct ${cls}" data-act="acct" data-k="${k}" aria-pressed="${ui.acct===k}">
      <span class="label"><i></i>${label}</span>
      <span class="bal ${value<0?'neg':''}">${euro(value)}</span>
      <span class="sub">${sub}</span>
    </button>`;

  let html = `
  ${one ? `<section class="accounts one" aria-label="Kontostand">
    <div class="acct total"><span class="label"><i></i>Kontostand</span><span class="bal ${total<0?'neg':''}">${euro(total)}</span><span class="sub">Bank und Bargeld zusammen</span></div>
  </section>` : `<section class="accounts" aria-label="Kontostände">
    ${acctCard('bank','bank','Bankkonto',bal.bank, ui.acct==='bank'?'Filter aktiv':'Antippen zum Filtern')}
    ${acctCard('cash','cash','Bargeld',bal.cash, ui.acct==='cash'?'Filter aktiv':'Antippen zum Filtern')}

function renderLedger(list, running){
  if (!S.finance.tx.length){
    return `<div class="empty"><strong>Noch keine Buchungen</strong>
      ${isCombined() ? 'Trag deine Einnahmen und Ausgaben ein. Unter „Anfangsbestand“ legst du fest, mit welchem Betrag du startest.' : 'Trag Einnahmen und Ausgaben für dein Bankkonto und dein Bargeld ein. Einzahlungen und Abhebungen verschieben Geld zwischen beiden.'}
      <div class="row"><button class="btn primary" data-act="newtx">+ Erste Buchung</button></div></div>`;
  }
  if (!list.length) return `<div class="empty"><strong>Keine Buchungen in diesem Monat</strong>${ui.acct!=='all'?'Filter: '+ACCT[ui.acct]+'. ':''}<div class="row"><button class="btn primary" data-act="newtx">+ Buchung</button></div></div>`;
  const desc = list.slice().reverse();
  const one = isCombined();
  let html = '', cur = '';
  desc.forEach(t => {
    if (t.date !== cur){
      cur = t.date;
      const dayIn = desc.filter(x => x.date===cur);
      html += `<div class="day"><span>${fmtDay(cur)}</span><span>${dayIn.length} ${dayIn.length===1?'Buchung':'Buchungen'}</span></div>`;
    }
    const T = TYPES[t.type] || TYPES.ausgabe;
    let amtCls, amtTxt;
    if (ui.acct==='all'){
      if (t.type==='einnahme'){ amtCls='pos'; amtTxt='+'+euro(t.amount); }
      else if (t.type==='ausgabe'){ amtCls='neg'; amtTxt='−'+euro(t.amount); }
      else { amtCls='neu'; amtTxt=euro(t.amount); }
    } else {
      const v = effect(t)[ui.acct];
      amtCls = v>=0?'pos':'neg'; amtTxt = (v>=0?'+':'−')+euro(Math.abs(v));
    }
    const acctTag = one ? '' : (T.cls==='transfer')
      ? `<span class="tag ${t.type==='einzahlung'?'cash':'bank'}"><i></i>${t.type==='einzahlung'?'Bargeld':'Bank'}</span>→<span class="tag ${t.type==='einzahlung'?'bank':'cash'}"><i></i>${t.type==='einzahlung'?'Bank':'Bargeld'}</span>`
      : `<span class="tag ${t.account}"><i></i>${t.account==='cash'?'Bargeld':'Bank'}</span>`;
    const title = t.text || (T.cls==='transfer' ? (t.type==='einzahlung'?'Bargeld eingezahlt':'Geld abgehoben') : T.label);
    const run = !running[t.id] ? '' : one ? `<span class="run">${euro(running[t.id].bank + running[t.id].cash)}</span>` : ui.acct!=='all' ? `<span class="run">${euro(running[t.id][ui.acct])}</span>` : '';
    html += `<button class="tx" data-act="edittx" data-id="${esc(t.id)}">
      <span class="ico ${T.cls}" aria-hidden="true">${T.sym}</span>
      <span class="t">${esc(title)}</span>
      <span class="amt ${amtCls}">${amtTxt}</span>
      <span class="meta">${acctTag}${t.cat?(one?'<span>':'<span>· ')+esc(t.cat)+'</span>':''}<span>${one && !t.cat ? '' : '· '}${T.label}</span></span>
      ${run}
    </button>`;
  });
  return html;
}

const DEFAULT_PERIODS = [['08:00','08:45'],['08:50','09:35'],['09:55','10:40'],['10:45','11:30'],['11:50','12:35'],['12:40','13:25']];
const subjColor = s => { let h = 0; for (const ch of String(s).toLowerCase()) h = (h*31 + ch.charCodeAt(0)) >>> 0; return 'var(--s'+(h%8)+')'; };
const activePlan = () => S.schedule.plans.find(p => p.id===S.schedule.active) || S.schedule.plans[0];
const toMin = t => { const [h,m] = String(t||'').split(':').map(Number); return h*60+m; };

function renderSchedule(){
  const plans = S.schedule.plans;
  if (!plans.length){
    return `<div class="sec-head"><h2>Stundenplan</h2></div>
    <div class="panel empty"><strong>Noch kein Stundenplan</strong>
      Lege einen Plan an, z. B. für jedes Kind einen eigenen. Danach tippst du auf ein Feld und trägst Fach und Raum ein.
      <div class="row"><button class="btn primary" data-act="newplan">+ Stundenplan anlegen</button></div></div>`;
  }
  const P = activePlan();
  const nDays = P.saturday ? 6 : 5;
  const wd = (new Date().getDay()+6)%7; // 0=Mo
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const curPer = P.periods.findIndex(p => nowMin >= toMin(p[0]) && nowMin <= toMin(p[1]));
  if (ui.day >= nDays) ui.day = 0;

  const cellBtn = (d,p) => {
    const c = P.cells[d+'-'+p];
    const isNow = d===wd && p===curPer;
    if (c && c.subject) return `<button class="cell filled ${isNow?'now':''}" style="--c:${subjColor(c.subject)}" data-act="cell" data-d="${d}" data-p="${p}"><b>${esc(c.subject)}</b>${c.room||c.teacher?`<small>${esc([c.room,c.teacher].filter(Boolean).join(' · '))}</small>`:''}</button>`;
    return `<button class="cell ${isNow?'now':''}" data-act="cell" data-d="${d}" data-p="${p}" aria-label="${DAYS_LONG[d]}, ${p+1}. Stunde eintragen"><span class="plus">+</span></button>`;
  };
  const breakRow = (p, cols) => {
    if (p===0) return '';
    const gap = toMin(P.periods[p][0]) - toMin(P.periods[p-1][1]);
    return gap >= 15 ? `<tr class="break"><td></td><td colspan="${cols}"><div>${gap} Min. Pause</div></td></tr>` : '';
  };
  const desk = `<div class="tt-scroll"><table class="tt"><thead><tr><th style="width:78px"></th>${DAYS.slice(0,nDays).map((d,i)=>`<th class="${i===wd?'today':''}"><span>${d}</span></th>`).join('')}</tr></thead><tbody>
    ${P.periods.map((per,p) => breakRow(p,nDays) + `<tr><td class="per ${p===curPer?'now':''}"><b>${p+1}.</b><small>${esc(per[0])}<br>${esc(per[1])}</small></td>${Array.from({length:nDays},(_,d)=>`<td>${cellBtn(d,p)}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  const mob = `<div class="daytabs">${DAYS.slice(0,nDays).map((d,i)=>`<button class="${i===wd?'today':''}" data-act="day" data-d="${i}" aria-pressed="${ui.day===i}">${d}</button>`).join('')}</div>
    <div class="daylist" aria-label="${DAYS_LONG[ui.day]}">${P.periods.map((per,p)=>`<div class="dl-row"><div class="per ${p===curPer&&ui.day===wd?'now':''}" style="padding-top:6px"><b>${p+1}.</b><small>${esc(per[0])}–${esc(per[1])}</small></div>${cellBtn(ui.day,p)}</div>`).join('')}</div>`;

  return `<div class="sec-head"><h2>Stundenplan</h2>
      <div class="chips">${plans.map(pl=>`<button class="chip" data-act="plan" data-id="${esc(pl.id)}" aria-pressed="${pl.id===P.id}">${esc(pl.name)}</button>`).join('')}
      <button class="chip" data-act="newplan" aria-label="Neuen Plan anlegen">+ Plan</button></div>
      <button class="btn sm" data-act="editplan">Zeiten & Name</button></div>
    <div class="panel" style="padding:10px">
      <div class="tt-desk">${desk}</div>
      <div class="tt-mob">${mob}</div>
    </div>`;
}
function planDialog(plan){
  const isNew = !plan;
  plan = plan ? clone(plan) : {id:newId(), name:'', saturday:false, periods:clone(DEFAULT_PERIODS), cells:{}};
  const rows = () => plan.periods.map((p,i)=>`<div class="row2" style="grid-template-columns:28px 1fr 1fr 36px;align-items:center">
      <b style="font-family:var(--f-display)">${i+1}.</b>
      <input class="field-in" type="time" data-i="${i}" data-k="0" value="${esc(p[0])}" aria-label="${i+1}. Stunde Beginn" id="pt-${i}-0">
      <input class="field-in" type="time" data-i="${i}" data-k="1" value="${esc(p[1])}" aria-label="${i+1}. Stunde Ende" id="pt-${i}-1">
      <button type="button" class="icon-btn" data-rm="${i}" aria-label="${i+1}. Stunde entfernen">×</button></div>`).join('');
  const form = openDlg(`
    <h3>${isNew?'Neuer Stundenplan':'Stundenplan bearbeiten'}</h3>

      <button type="button" class="btn sm" id="padd" style="align-self:flex-start;margin-top:4px">+ Stunde</button></div>

      <button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>`, f => {
      const name = f.name.value.trim();
      if (!name){ f.querySelector('#f-err').textContent = 'Bitte einen Namen eingeben.'; f.name.focus(); return false; }
      plan.name = name; plan.saturday = f.sat.checked;

      S.schedule.active = plan.id; save('schedule'); toast('Stundenplan gespeichert');
    });
  const box = form.querySelector('#prow');
  const css = 'border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;min-width:0;width:100%;font-size:16px';
  const paint = () => { box.innerHTML = rows(); box.querySelectorAll('input').forEach(i=>i.style.cssText=css); };
  paint();
  box.addEventListener('input', e => { const i = e.target.dataset.i; if (i!=null) plan.periods[+i][+e.target.dataset.k] = e.target.value; });
  box.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; const i = +b.dataset.rm;
    plan.periods.splice(i,1);
    const nc = {}; Object.entries(plan.cells).forEach(([k,v]) => { const [d,p] = k.split('-').map(Number); if (p<i) nc[k]=v; else if (p>i) nc[d+'-'+(p-1)]=v; }); plan.cells = nc;
    paint(); });
  form.querySelector('#padd').addEventListener('click', () => {
    const last = plan.periods[plan.periods.length-1];
    let s = last ? toMin(last[1]) + 5 : 480; const e = s + 45;
    const t = m => pad(Math.floor(m/60)%24)+':'+pad(m%60);
    plan.periods.push([t(s),t(e)]); paint(); });
  const del = form.querySelector('#pdel');
  if (del) del.addEventListener('click', () => { if (!armed(del,'Wirklich löschen?')) return;
    S.schedule.plans = S.schedule.plans.filter(p=>p.id!==plan.id); S.schedule.active = S.schedule.plans[0]?.id ?? null; save('schedule'); closeDlg(); toast('Plan gelöscht'); });
}

const PRIO = {hoch:'Hoch', normal:'Normal', niedrig:'Niedrig'};
const prioRank = {hoch:0, normal:1, niedrig:2};
function renderTasks(){
  const items = S.tasks.items;
  const t0 = today();
  const open = items.filter(x=>!x.done), done = items.filter(x=>x.done);
  const counts = {offen:open.length, faellig:open.filter(x=>x.due && x.due<=t0).length, erledigt:done.length};
  const filters = [['offen','Offen'],['faellig','Fällig'],['erledigt','Erledigt']];
  let html = `<div class="sec-head"><h2>Aufgaben</h2><div class="chips">${filters.map(([k,l])=>`<button class="chip" data-act="tf" data-k="${k}" aria-pressed="${ui.taskFilter===k}">${l} <span class="num" style="opacity:.7">${counts[k]}</span></button>`).join('')}</div></div>
  <form class="panel quick" id="quick" autocomplete="off">
    <input name="title" placeholder="Neue Aufgabe, z. B. Elternabend vorbereiten" aria-label="Neue Aufgabe" id="q-title">
    <input name="due" type="date" aria-label="Fällig am" id="q-due">
    <select name="prio" aria-label="Priorität" id="q-prio"><option value="normal">Normal</option><option value="hoch">Hoch</option><option value="niedrig">Niedrig</option></select>
    <button class="btn primary" type="submit">Hinzufügen</button>
  </form>
  <div class="panel" style="margin-top:12px;overflow:hidden">`;

  if (!items.length){
    html += `<div class="empty"><strong>Keine Aufgaben</strong>Tipp oben einen Titel ein und drück auf Hinzufügen. Ein Datum ist optional.</div></div>`;
    return html;
  }
  const sortOpen = l => l.slice().sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : prioRank[a.prio||'normal'] - prioRank[b.prio||'normal']);
  const groups = [];
  if (ui.taskFilter==='erledigt'){
    groups.push(['Erledigt', done.slice().sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)), '']);
  } else {
    const list = sortOpen(ui.taskFilter==='faellig' ? open.filter(x=>x.due && x.due<=t0) : open);
    groups.push(['Überfällig', list.filter(x=>x.due && x.due<t0), 'over']);
    groups.push(['Heute', list.filter(x=>x.due===t0), '']);
    groups.push(['Demnächst', list.filter(x=>x.due && x.due>t0), '']);
    groups.push(['Ohne Datum', list.filter(x=>!x.due), '']);
  }
  let any = false;
  groups.forEach(([name,list,cls]) => {
    if (!list.length) return; any = true;
    html += `<div class="group-h ${cls}">${name} <small>${list.length}</small></div>` + list.map(taskRow).join('');
  });
  if (!any) html += `<div class="empty"><strong>${ui.taskFilter==='erledigt'?'Noch nichts erledigt':'Nichts fällig'}</strong>${ui.taskFilter==='faellig'?'Heute und überfällig ist alles erledigt.':''}</div>`;
  if (ui.taskFilter==='erledigt' && done.length) html += `<div style="padding:12px 14px;border-top:1px solid var(--line)"><button class="btn danger sm" data-act="cleardone">Erledigte löschen</button></div>`;
  return html + '</div>';
}
function taskRow(x){
  const t0 = today(); let due = '';
  if (x.due){
    const n = daysBetween(t0, x.due);
    if (x.done) due = `<span>${fmtShort(x.due)}</span>`;
    else if (n<0) due = `<span class="over">${n===-1?'seit gestern':'seit '+(-n)+' Tagen'} überfällig</span>`;
    else if (n===0) due = `<span class="tod">Heute</span>`;
    else if (n===1) due = `<span>Morgen</span>`;
    else due = `<span>${fmtDay(x.due)}</span>`;
  }
  const p = x.prio||'normal';
  return `<div class="task ${x.done?'done':''}">
    <button class="check" data-act="toggle" data-id="${esc(x.id)}" aria-label="${x.done?'Als offen markieren':'Als erledigt markieren'}: ${esc(x.title)}">${CHECK}</button>
    <button class="tt" data-act="edittask" data-id="${esc(x.id)}">${esc(x.title)}</button>
    <span class="prio ${p}">${PRIO[p]}</span>
    <span class="meta">${due}${x.note?`<span>${esc(x.note)}</span>`:''}${!due&&!x.note?'<span>Ohne Datum</span>':''}</span>
  </div>`;
}
function taskDialog(x){
  const form = openDlg(`
    <h3>Aufgabe bearbeiten</h3>
    <label class="field"><span>Titel</span><input name="title" value="${esc(x.title)}" autofocus id="t-title"></label>
    <div class="row2">
      <label class="field"><span>Fällig am</span><input type="date" name="due" value="${esc(x.due||'')}" id="t-due"></label>
      <label class="field"><span>Priorität</span><select name="prio" id="t-prio">${Object.entries(PRIO).map(([k,l])=>`<option value="${k}" ${(x.prio||'normal')===k?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>Notiz</span><textarea name="note" id="t-note">${esc(x.note||'')}</textarea></label>
    <div class="err" id="f-err"></div>
    <div class="dlg-actions"><button type="button" class="btn danger" id="tdel">Löschen</button><span class="spacer"></span>
      <button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>`, f => {
      const title = f.title.value.trim();
      if (!title){ f.querySelector('#f-err').textContent = 'Bitte einen Titel eingeben.'; return false; }
      Object.assign(x, {title, due:f.due.value, prio:f.prio.value, note:f.note.value.trim()}); save('tasks');
    });
  const del = form.querySelector('#tdel');
  del.addEventListener('click', () => { if (!armed(del,'Wirklich löschen?')) return; S.tasks.items = S.tasks.items.filter(i=>i.id!==x.id); save('tasks'); closeDlg(); toast('Aufgabe gelöscht'); });
}

/* =========================================================
   HAUSAUFGABEN
   ========================================================= */
const planName = id => S.schedule.plans.find(p => p.id===id)?.name || '';
function nextLesson(planId, subject){
  const P = S.schedule.plans.find(p => p.id===planId); const s = String(subject||'').trim().toLowerCase();
  if (!P || !s) return null;
  const d = new Date();
  for (let i=1; i<=21; i++){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()+i);
    const wd = (x.getDay()+6)%7; if (wd > (P.saturday?5:4)) continue;
    for (let p=0; p<P.periods.length; p++){ const c = P.cells[wd+'-'+p]; if (c && c.subject && c.subject.trim().toLowerCase()===s) return iso(x); }
  }
  return null;
}
function hwDueLabel(x){
  if (!x.due) return x.done ? '' : '<span>Ohne Termin</span>';
  const n = daysBetween(today(), x.due);
  if (x.done) return `<span>bis ${fmtShort(x.due)}</span>`;
  if (n<0) return `<span class="over">${n===-1?'war gestern fällig':'seit '+(-n)+' Tagen überfällig'}</span>`;
  if (n===0) return '<span class="tod">heute fällig</span>';
  if (n===1) return '<span class="tod">bis morgen</span>';
  return `<span>bis ${fmtDay(x.due)}</span>`;
}
function hwRow(x, showKid){
  return `<div class="hw ${x.done?'done':''}" style="--c:${x.subject?subjColor(x.subject):'var(--muted)'}">
    <button class="check" data-act="hw-toggle" data-id="${esc(x.id)}" aria-label="${x.done?'Als offen markieren':'Als erledigt markieren'}: ${esc(x.subject)} ${esc(x.text)}">${CHECK}</button>
    <button class="body" data-act="hw-edit" data-id="${esc(x.id)}">${x.subject?`<span class="subj">${esc(x.subject)}</span>`:''}<span class="txt">${esc(x.text || 'Hausaufgabe')}</span></button>
    <span class="meta">${hwDueLabel(x)}${showKid && x.plan && planName(x.plan) ? `<span class="kid">${esc(planName(x.plan))}</span>` : ''}${x.note?`<span>${esc(x.note)}</span>`:''}</span>
  </div>`;
}
function renderHomework(){
  const plans = S.schedule.plans;
  if (ui.hwPlan !== 'all' && !plans.some(p => p.id===ui.hwPlan)) ui.hwPlan = 'all';
  const all = S.homework.items.filter(x => ui.hwPlan==='all' || x.plan===ui.hwPlan || !x.plan);
  const open = all.filter(x=>!x.done), done = all.filter(x=>x.done);
  const t0 = today();
  let html = `<div class="sec-head"><h2>Hausaufgaben</h2>
    <div class="chips">${[['offen','Offen',open.length],['erledigt','Erledigt',done.length]].map(([k,l,n])=>`<button class="chip" data-act="hw-filter" data-k="${k}" aria-pressed="${ui.hwFilter===k}">${l} <span class="num" style="opacity:.7">${n}</span></button>`).join('')}</div>
    <button class="btn primary" data-act="hw-new">+ Hausaufgabe</button></div>`;
  if (plans.length > 1) html += `<div class="chips" style="margin-bottom:12px"><button class="chip" data-act="hw-kid" data-id="all" aria-pressed="${ui.hwPlan==='all'}">Alle</button>${plans.map(p=>`<button class="chip" data-act="hw-kid" data-id="${esc(p.id)}" aria-pressed="${ui.hwPlan===p.id}">${esc(p.name)}</button>`).join('')}</div>`;
  html += '<div class="panel" style="overflow:hidden">';
  if (!S.homework.items.length){
    return html + `<div class="empty"><strong>Keine Hausaufgaben eingetragen</strong>
      Trag Fach, Aufgabe und Abgabetermin ein. ${plans.length ? 'Mit „Nächste Stunde“ wird der Termin aus dem Stundenplan übernommen.' : 'Mit einem Stundenplan kann der Termin automatisch auf die nächste Stunde des Fachs gesetzt werden.'}
      <div class="row"><button class="btn primary" data-act="hw-new">+ Erste Hausaufgabe</button></div></div></div>`;
  }
  const showKid = plans.length > 1 && ui.hwPlan==='all';
  const groups = [];
  if (ui.hwFilter==='erledigt') groups.push(['Erledigt', done.slice().sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)), '']);
  else {
    const list = open.slice().sort((a,b) => (a.due||'9999').localeCompare(b.due||'9999') || String(a.subject).localeCompare(String(b.subject)));
    const tm = (() => { const d = new Date(); d.setDate(d.getDate()+1); return iso(d); })();
    groups.push(['Überfällig', list.filter(x=>x.due && x.due<t0), 'over']);
    groups.push(['Heute', list.filter(x=>x.due===t0), '']);
    groups.push(['Für morgen', list.filter(x=>x.due===tm), '']);
    groups.push(['Später', list.filter(x=>x.due && x.due>tm), '']);
    groups.push(['Ohne Termin', list.filter(x=>!x.due), '']);
  }
  let any = false;
  groups.forEach(([name,list,cls]) => { if (!list.length) return; any = true;
    html += `<div class="group-h ${cls}">${name} <small>${list.length}</small></div>` + list.map(x => hwRow(x, showKid)).join(''); });
  if (!any) html += `<div class="empty"><strong>${ui.hwFilter==='erledigt'?'Noch nichts erledigt':'Alles erledigt'}</strong>${ui.hwFilter==='offen'?'Keine offenen Hausaufgaben.':''}</div>`;
  if (ui.hwFilter==='erledigt' && done.length) html += `<div style="padding:12px 14px;border-top:1px solid var(--line)"><button class="btn danger sm" data-act="hw-cleardone">Erledigte löschen</button></div>`;
  return html + '</div>';
}
function hwDialog(x){
  const isNew = !x;
  const plans = S.schedule.plans;
  x = x ? clone(x) : {subject:'', text:'', due:'', note:'', plan: ui.hwPlan!=='all' ? ui.hwPlan : (plans.length===1 ? plans[0].id : '')};
  const subjOf = pid => [...new Set((pid ? plans.filter(p=>p.id===pid) : plans).flatMap(p => Object.values(p.cells).map(c=>c.subject)).concat(S.homework.items.map(h=>h.subject)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const form = openDlg(`
    <h3>${isNew?'Neue Hausaufgabe':'Hausaufgabe bearbeiten'}</h3>
    ${plans.length ? `<label class="field"><span>Für</span><select name="plan" id="hw-plan"><option value="">– kein Stundenplan –</option>${plans.map(p=>`<option value="${esc(p.id)}" ${x.plan===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>` : ''}
    <label class="field"><span>Fach</span><input name="subject" list="hwsubj" value="${esc(x.subject)}" placeholder="z. B. Mathe" autofocus id="hw-subject"><datalist id="hwsubj"></datalist></label>
    <label class="field"><span>Aufgabe</span><textarea name="text" placeholder="z. B. Buch S. 42, Nr. 3–5" id="hw-text">${esc(x.text)}</textarea></label>
    <label class="field"><span>Abgeben bis</span><input type="date" name="due" value="${esc(x.due)}" id="hw-due"></label>
    <div class="hw-next" id="hw-next" hidden></div>
    <label class="field"><span>Notiz</span><input name="note" value="${esc(x.note)}" placeholder="z. B. Arbeitsblatt in der Mappe" id="hw-note"></label>
    <div class="err" id="f-err"></div>
    <div class="dlg-actions">${isNew?'':'<button type="button" class="btn danger" id="hw-del">Löschen</button>'}<span class="spacer"></span>
      <button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div>`, f => {
      const subject = f.subject.value.trim(), text = f.text.value.trim();
      if (!subject && !text){ f.querySelector('#f-err').textContent = 'Bitte Fach oder Aufgabe eintragen.'; f.subject.focus(); return false; }
      const rec = {id: x.id || newId(), created: x.created || Date.now(), subject, text, due: f.due.value, note: f.note.value.trim(),
        plan: f.plan ? f.plan.value : '', done: !!x.done, doneAt: x.doneAt || null};
      const i = S.homework.items.findIndex(h => h.id===rec.id);
      if (i>=0) S.homework.items[i] = rec; else S.homework.items.push(rec);
      if (ui.hwFilter==='erledigt' && !rec.done) ui.hwFilter = 'offen';
      save('homework'); toast(isNew?'Hausaufgabe gespeichert':'Änderung gespeichert');
    });
  let autoDate = isNew;
  const box = form.querySelector('#hw-next');
  const refresh = () => {
    const pid = form.plan ? form.plan.value : '';
    form.querySelector('#hwsubj').innerHTML = subjOf(pid).map(s=>`<option value="${esc(s)}">`).join('');
    const nd = nextLesson(pid, form.subject.value);
    if (!nd){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<span>Nächste Stunde ${esc(form.subject.value.trim())}: <b>${fmtDay(nd)}</b></span>${form.due.value===nd?'':'<button type="button" class="btn sm" id="hw-use">Übernehmen</button>'}`;
    if (autoDate && !form.due.value){ form.due.value = nd; box.querySelector('#hw-use')?.remove(); }
    box.querySelector('#hw-use')?.addEventListener('click', () => { form.due.value = nd; refresh(); });
  };
  form.subject.addEventListener('input', () => { if (autoDate) form.due.value = ''; refresh(); });
  form.due.addEventListener('input', () => { autoDate = false; refresh(); });
  if (form.plan) form.plan.addEventListener('change', () => { if (autoDate) form.due.value = ''; refresh(); });
  refresh();
  const del = form.querySelector('#hw-del');
  if (del) del.addEventListener('click', () => { if (!armed(del,'Wirklich löschen?')) return; S.homework.items = S.homework.items.filter(h=>h.id!==x.id); save('homework'); closeDlg(); toast('Hausaufgabe gelöscht'); });
}

/* ---------- Ereignisse ---------- */
document.getElementById('settingsBtn').addEventListener('click', settingsDialog);
$('#main').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='acct'){ ui.acct = b.dataset.k; render(); }
  else if (a==='month'){ const [y,m] = ui.month.split('-').map(Number); const d = new Date(y, m-1+Number(b.dataset.d), 1); ui.month = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); }
  else if (a==='newtx') txDialog();
  else if (a==='edittx') txDialog(S.finance.tx.find(t=>t.id===b.dataset.id));
  else if (a==='start') startDialog();
  else if (a==='newplan') planDialog();
  else if (a==='editplan') planDialog(activePlan());
  else if (a==='plan'){ S.schedule.active = b.dataset.id; save('schedule'); render(); }
  else if (a==='cell') cellDialog(+b.dataset.d, +b.dataset.p);
  else if (a==='day'){ ui.day = +b.dataset.d; render(); }
  else if (a==='tf'){ ui.taskFilter = b.dataset.k; render(); }
  else if (a==='toggle'){ const x = S.tasks.items.find(i=>i.id===b.dataset.id); if (x){ x.done = !x.done; x.doneAt = x.done?Date.now():null; save('tasks'); render(); if (x.done) toast('Erledigt'); } }
  else if (a==='edittask'){ const x = S.tasks.items.find(i=>i.id===b.dataset.id); if (x) taskDialog(x); }
  else if (a==='cleardone'){ if (!armed(b,'Alle erledigten löschen?')) return; S.tasks.items = S.tasks.items.filter(i=>!i.done); save('tasks'); render(); toast('Erledigte gelöscht'); }
  else if (a==='hw-new') hwDialog();
  else if (a==='hw-edit'){ const x = S.homework.items.find(i=>i.id===b.dataset.id); if (x) hwDialog(x); }
  else if (a==='hw-toggle'){ const x = S.homework.items.find(i=>i.id===b.dataset.id); if (x){ x.done = !x.done; x.doneAt = x.done?Date.now():null; save('homework'); render(); if (x.done) toast('Erledigt'); } }
  else if (a==='hw-filter'){ ui.hwFilter = b.dataset.k; render(); }
  else if (a==='hw-kid'){ ui.hwPlan = b.dataset.id; render(); }
  else if (a==='hw-cleardone'){ if (!armed(b,'Alle erledigten löschen?')) return; S.homework.items = S.homework.items.filter(i=>!i.done); save('homework'); render(); toast('Erledigte gelöscht'); }
});
$('#main').addEventListener('submit', e => {
  if (e.target.id !== 'quick') return;
  e.preventDefault();
  const f = e.target, title = f.title.value.trim();
  if (!title){ f.title.focus(); return; }
  S.tasks.items.push({id:newId(), created:Date.now(), title, due:f.due.value, prio:f.prio.value, note:'', done:false});
  save('tasks');
  if (ui.taskFilter==='erledigt') ui.taskFilter = 'offen';
  render(); const q = $('#q-title'); if (q) q.focus();
});

render();
initLocal();
document.getElementById('backupBtn').addEventListener('click', backupDialog);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(() => { if (ui.tab==='stundenplan' && !dlg.open) render(); }, 60000);
})();
</script>
</body>
</html>
